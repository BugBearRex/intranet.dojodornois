    <style>
        :root {
            --rouge: #C41E3A;
            --noir-doux: #1A1A1A;
            --gris-fonce: #3D3D3D;
            --gris-moyen: #6B6B6B;
            --gris-clair: #B8B8B8;
            --gris-tres-clair: #E8E8E8;
            --fond: #F4F6F9;
            --topbar-height: 68px;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--fond);
            color: var(--gris-fonce);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .font-fredoka { font-family: 'Fredoka', sans-serif; }

        .split-container {
            display: flex;
            height: calc(100vh - var(--topbar-height));
            width: 100%;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-left {
            border-right: 1px solid var(--gris-tres-clair);
            background: #FFFFFF;
        }

        .panel-right {
            background: var(--fond);
            padding: 24px;
            overflow-y: auto;
        }

        .toolbar-pro {
            background: #F8FAFC;
            border-bottom: 1px solid var(--gris-tres-clair);
            padding: 10px 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 4px;
            border-right: 2px solid var(--gris-tres-clair);
            padding-right: 8px;
        }
        .toolbar-group:last-child { border-right: none; padding-right: 0; }

        .tool-btn {
            background: #FFFFFF;
            border: 1px solid var(--gris-tres-clair);
            color: var(--gris-fonce);
            width: 32px;
            height: 32px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .tool-btn:hover { background: var(--gris-tres-clair); color: var(--noir-doux); }
        .tool-btn.active-source {
            background: #1A1A1A;
            color: #FFFFFF;
            border-color: #1A1A1A;
        }

        .tool-select {
            background: #FFFFFF;
            border: 1px solid var(--gris-tres-clair);
            height: 32px;
            padding: 0 8px;
            border-radius: 4px;
            font-size: 12px;
            color: var(--gris-fonce);
            outline: none;
            cursor: pointer;
        }

        .editor-workspace {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            background: #FFFFFF;
            outline: none;
            font-family: 'Roboto', Arial, sans-serif;
            font-size: 15px;
            color: var(--gris-fonce);
        }

        .editor-workspace[contenteditable="true"]:empty:before {
            content: attr(placeholder);
            color: var(--gris-clair);
            pointer-events: none;
            display: block;
        }

        .source-workspace {
            flex: 1;
            padding: 20px;
            background: #1E293B;
            color: #F8FAFC;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
            border: none;
            outline: none;
            resize: none;
            display: none;
        }

        .preview-box {
            background: #FFFFFF;
            border: 1px solid var(--gris-tres-clair);
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            min-height: 500px;
        }

        .preview-header {
            background: var(--noir-doux);
            color: #FFFFFF;
            padding: 12px 20px;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tab-btn {
            padding: 8px 16px;
            font-weight: 600;
            font-size: 13px;
            border-bottom: 2px solid transparent;
            color: #6B6B6B;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tab-btn.active {
            color: var(--rouge);
            border-bottom-color: var(--rouge);
            background: #FFF5F6;
        }

</head>

        function getCodeFinal() {
            let contenu = modeCodeSource ? sourceEditor.value : editor.innerHTML;
            
            contenu = contenu.replace(/<h1>/g, '<h1 style="font-family: \'Fredoka\', sans-serif; font-size: 24px; color: #C41E3A !important; margin-top: 0; margin-bottom: 15px; text-align: left;"><span style="color: #C41E3A !important;">');
            contenu = contenu.replace(/<\/h1>/g, '</span></h1>');
            contenu = contenu.replace(/<h2>/g, '<h2 style="font-family: \'Fredoka\', sans-serif; font-size: 20px; color: #1A1A1A !important; margin-top: 0; margin-bottom: 12px; text-align: left;"><span style="color: #1A1A1A !important;">');
            contenu = contenu.replace(/<\/h2>/g, '</span></h2>');
            contenu = contenu.replace(/<p>/g, '<p style="margin-top: 0; margin-bottom: 15px; line-height: 1.6; color: #3D3D3D;">');

            let preHeader = 'Message du Dojo Dornois';
            if (modeActuel === 'newsletter') preHeader = 'Actualités du Dojo Dornois';
            if (modeActuel === 'rds') preHeader = 'Bon de Commande & Réassort RDS Sport - Dojo Dornois';

            return `
                <div style="display:none;font-size:1px;color:#F4F6F9;line-height:1px;max-height:0px;max-width:0px;opacity:0;overflow:hidden;">${preHeader}</div>
                <style type="text/css">
                    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Roboto:wght@400;500&display=swap');
                </style>
                <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #F4F6F9; padding: 20px 0;">
                    <tr>
                        <td align="center">
                            <!--[if mso]>
                            <table width="650" cellpadding="0" cellspacing="0" border="0"><tr><td>
                            <![endif]-->
                            <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #FFFFFF; max-width: 650px; width: 100%; border: 1px solid #E8E8E8; border-radius: 8px; margin: auto;">
                                <tr>
                                    <td style="padding: 30px; font-family: 'Roboto', Arial, sans-serif; font-size: 15px; color: #3D3D3D; line-height: 1.6;">
                                        ${contenu}
                                    </td>
                                </tr>
                            </table>
                            <!--[if mso]>
                            </td></tr></table>
                            <![endif]-->
                        </td>
                    </tr>
                </table>
            `;
        }

        function genererApercu() {
            previewOutput.innerHTML = getCodeFinal();
        }

        function copierCodeHTML() {
            genererApercu();
            navigator.clipboard.writeText(getCodeFinal()).then(() => {
                let message = "✅ Code HTML copié ! Prêt à être collé.";
                if (modeActuel === 'newsletter') {
                    message = "✅ Code HTML copié ! Prêt à être collé dans Kalisport.";
                } else if (modeActuel === 'rds') {
                    message = "✅ Code du Bon de Commande copié ! Prêt pour votre envoi.";
                }
                alert(message);
            }).catch(err => {
                alert("Erreur lors de la copie.");
            });
        }

        function copierRichText() {
            genererApercu();
            const target = document.getElementById('preview-output');
            
            if (!target.innerHTML.trim()) return alert("L'éditeur est vide.");
            
            const range = document.createRange();
            range.selectNode(target);
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
            
            try {
                document.execCommand("copy");
                alert("✅ Rendu visuel copié ! Prêt à être collé directement dans Gmail.");
            } catch (err) {
                alert("Erreur lors de la copie.");
            }
            selection.removeAllRanges();
        }

        editor.addEventListener('input', () => {
            memoireContenu[modeActuel] = editor.innerHTML;
            genererApercu();
        });

        sourceEditor.addEventListener('input', () => {
            genererApercu();
        });

        window.onload = function() {
            editor.innerHTML = GABARIT_NEWSLETTER_INITIAL;
            genererApercu();
        };
