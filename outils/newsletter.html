<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Communications & Mails - Dojo Dornois</title>
    
    <!-- POLICES OFFICIELLES -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- TAILWIND CSS & FONTAWESOME -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --rouge: #C41E3A;
            --noir-doux: #1A1A1A;
            --gris-fonce: #3D3D3D;
            --gris-moyen: #6B6B6B;
            --gris-clair: #B8B8B8;
            --gris-tres-clair: #E8E8E8;
            --fond: #F4F6F9;
            --topbar-height: 68px;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--fond);
            color: var(--gris-fonce);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .font-fredoka { font-family: 'Fredoka', sans-serif; }

        /* VUE SPLIT SCREEN */
        .split-container {
            display: flex;
            height: calc(100vh - var(--topbar-height));
            width: 100%;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-left {
            border-right: 1px solid var(--gris-tres-clair);
            background: #FFFFFF;
        }

        .panel-right {
            background: var(--fond);
            padding: 24px;
            overflow-y: auto;
        }

        /* BARRE D'OUTILS */
        .toolbar-pro {
            background: #F8FAFC;
            border-bottom: 1px solid var(--gris-tres-clair);
            padding: 10px 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 4px;
            border-right: 2px solid var(--gris-tres-clair);
            padding-right: 8px;
        }
        .toolbar-group:last-child { border-right: none; padding-right: 0; }

        .tool-btn {
            background: #FFFFFF;
            border: 1px solid var(--gris-tres-clair);
            color: var(--gris-fonce);
            width: 32px;
            height: 32px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .tool-btn:hover { background: var(--gris-tres-clair); color: var(--noir-doux); }

        .tool-select {
            background: #FFFFFF;
            border: 1px solid var(--gris-tres-clair);
            height: 32px;
            padding: 0 8px;
            border-radius: 4px;
            font-size: 12px;
            color: var(--gris-fonce);
            outline: none;
            cursor: pointer;
        }

        /* ZONE D'ÉDITION */
        .editor-workspace {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            background: #FFFFFF;
            outline: none;
            font-family: 'Roboto', Arial, sans-serif;
            font-size: 15px;
            color: var(--gris-fonce);
        }

        .editor-workspace[contenteditable="true"]:empty:before {
            content: attr(placeholder);
            color: var(--gris-clair);
            pointer-events: none;
            display: block;
        }

        .editor-workspace h1, .editor-workspace h2, .editor-workspace h3 {
            font-family: 'Fredoka', sans-serif !important;
            margin-top: 0;
            text-align: left;
        }
        .editor-workspace h1 { font-size: 24px; color: var(--rouge); margin-bottom: 15px; }
        .editor-workspace h2 { font-size: 20px; color: var(--noir-doux); margin-bottom: 12px; }
        .editor-workspace p { margin-bottom: 15px; line-height: 1.6; }
        .editor-workspace a { color: #3498DB; text-decoration: underline; }
        .editor-workspace ul { margin-left: 20px; list-style-type: disc; margin-bottom: 15px; }

        /* ZONE D'APERÇU */
        .preview-box {
            background: #FFFFFF;
            border: 1px solid var(--gris-tres-clair);
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            min-height: 500px;
        }

        .preview-header {
            background: var(--noir-doux);
            color: #FFFFFF;
            padding: 12px 20px;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .preview-content {
            padding: 0;
        }

        /* ONGLETS */
        .tab-btn {
            padding: 8px 16px;
            font-weight: 600;
            font-size: 13px;
            border-bottom: 2px solid transparent;
            color: #6B6B6B;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tab-btn.active {
            color: var(--rouge);
            border-bottom-color: var(--rouge);
            background: #FFF5F6;
        }
    </style>
</head>
<body class="text-slate-800 antialiased">

    <!-- SIDEBAR UNIFIÉE -->
    <div class="sidebar no-print w-[270px] shrink-0 bg-[#1A1A1A] h-full shadow-xl z-50"></div>

    <!-- CONTENU PRINCIPAL -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden main-content h-screen">
        
        <header class="bg-white border-b border-slate-200 px-6 py-2.5 flex items-center justify-between shrink-0">
            <div class="flex items-center gap-6">
                <div>
                    <h1 class="font-fredoka text-xl font-bold text-[#1A1A1A]">Studio de Communication</h1>
                    <p class="text-xs text-slate-500" id="header-subtitle">Création visuelle d'emails et newsletters</p>
                </div>

                <!-- NAVIGATION ONGLETS -->
                <div class="flex items-center gap-2 bg-slate-100 p-1 rounded-lg border border-slate-200 ml-4">
                    <button id="tab-newsletter" onclick="changerOnglet('newsletter')" class="tab-btn active rounded-md">
                        <i class="fa-solid fa-newspaper"></i> Newsletter
                    </button>
                    <button id="tab-mail" onclick="changerOnglet('mail')" class="tab-btn rounded-md">
                        <i class="fa-solid fa-envelope-open-text"></i> Mails & Courriels
                    </button>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="genererApercu()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-bold flex items-center gap-2">
                    <i class="fa-solid fa-arrows-rotate"></i> Actualiser
                </button>
                <button onclick="copierCodeHTML()" class="px-4 py-2 bg-[#1A1A1A] hover:bg-slate-800 text-white rounded-lg text-xs font-bold flex items-center gap-2">
                    <i class="fa-solid fa-code"></i> Copier HTML
                </button>
                <button onclick="copierRichText()" class="px-4 py-2 bg-[#C41E3A] hover:bg-[#A3182E] text-white rounded-lg text-xs font-bold flex items-center gap-2">
                    <i class="fa-brands fa-google"></i> Copier pour Gmail
                </button>
            </div>
        </header>

        <div class="split-container">
            
            <!-- PANNEAU ÉDITEUR -->
            <div class="panel panel-left flex flex-col">
                
                <div class="toolbar-pro">
                    <div class="toolbar-group">
                        <button class="tool-btn" onclick="format('undo')" title="Annuler"><i class="fa-solid fa-rotate-left"></i></button>
                        <button class="tool-btn" onclick="format('redo')" title="Rétablir"><i class="fa-solid fa-rotate-right"></i></button>
                        <button class="tool-btn text-red-600" onclick="format('removeFormat')" title="Effacer le formatage"><i class="fa-solid fa-eraser"></i></button>
                    </div>

                    <div class="toolbar-group">
                        <select class="tool-select" onchange="format('formatBlock', this.value); this.selectedIndex=0;" title="Style">
                            <option value="" disabled selected>Format de texte</option>
                            <option value="<h1>">Titre 1 (Fredoka, Rouge)</option>
                            <option value="<h2>">Titre 2 (Fredoka, Noir)</option>
                            <option value="<p>">Paragraphe normal</option>
                        </select>
                    </div>

                    <div class="toolbar-group">
                        <button class="tool-btn" onclick="format('bold')" title="Gras"><i class="fa-solid fa-bold"></i></button>
                        <button class="tool-btn" onclick="format('italic')" title="Italique"><i class="fa-solid fa-italic"></i></button>
                        <button class="tool-btn" onclick="format('underline')" title="Souligné"><i class="fa-solid fa-underline"></i></button>
                    </div>

                    <div class="toolbar-group">
                        <button class="tool-btn" onclick="format('justifyLeft')" title="Aligner à gauche"><i class="fa-solid fa-align-left"></i></button>
                        <button class="tool-btn" onclick="format('justifyCenter')" title="Centrer"><i class="fa-solid fa-align-center"></i></button>
                        <button class="tool-btn" onclick="format('justifyRight')" title="Aligner à droite"><i class="fa-solid fa-align-right"></i></button>
                        <button class="tool-btn" onclick="format('justifyFull')" title="Justifier le texte"><i class="fa-solid fa-align-justify"></i></button>
                        <button class="tool-btn" onclick="format('insertUnorderedList')" title="Liste à puces"><i class="fa-solid fa-list-ul"></i></button>
                    </div>

                    <div class="toolbar-group">
                        <button class="tool-btn" onclick="ajouterLien()" title="Insérer un lien"><i class="fa-solid fa-link"></i></button>
                        <button class="tool-btn" onclick="ajouterImage()" title="Insérer une image"><i class="fa-regular fa-image"></i></button>
                    </div>

                    <!-- MODÈLES MAILS (Affiché uniquement en mode Mail) -->
                    <div id="group-modeles-mails" class="toolbar-group hidden">
                        <select class="tool-select font-bold text-blue-600 border-blue-600" onchange="chargerGabarit(this.value); this.selectedIndex=0;" title="Charger un modèle">
                            <option value="" disabled selected>✉️ Modèles de Mails</option>
                            <option value="reponse_officielle">Réponse Administrative Officielle</option>
                            <option value="relance_adhesion">Relance Dossier / Inscription</option>
                            <option value="convocation_reunion">Convocation / Invitation Réunion</option>
                            <option value="texte_vide">Réinitialiser (Texte vide)</option>
                        </select>
                    </div>

                    <!-- BLOCS NEWSLETTER -->
                    <div id="group-modules-newsletter" class="toolbar-group">
                        <select class="tool-select font-bold text-[#C41E3A] border-[#C41E3A]" onchange="insererModule(this.value); this.selectedIndex=0;" title="Insérer un module">
                            <option value="" disabled selected>🧩 Insérer un bloc</option>
                            <option value="header_officiel">En-tête : Officiel Dojo (Logo Carré)</option>
                            <option value="alerte_rouge">Bloc : Alerte Rouge</option>
                            <option value="encart_gris">Bloc : Information Grise</option>
                            <option value="bouton_cta">Composant : Bouton d'action</option>
                            <option value="separateur">Composant : Ligne de séparation</option>
                            <option value="footer_officiel">Pied de page : Centré Officiel</option>
                        </select>
                    </div>

                    <!-- BLOCS MAILS -->
                    <div id="group-modules-mail" class="toolbar-group hidden">
                        <select class="tool-select font-bold text-[#C41E3A] border-[#C41E3A]" onchange="insererModule(this.value); this.selectedIndex=0;" title="Insérer un bloc">
                            <option value="" disabled selected>🧩 Insérer un bloc</option>
                            <option value="layout_2col">Layout : 2 Colonnes d'information</option>
                            <option value="alerte_rouge">Bloc : Alerte Rouge</option>
                            <option value="encart_gris">Bloc : Information Grise</option>
                            <option value="bouton_cta">Composant : Bouton d'action</option>
                            <option value="separateur">Composant : Ligne de séparation</option>
                        </select>
                    </div>
                </div>

                <div id="editor" class="editor-workspace" contenteditable="true" placeholder="Rédigez votre contenu ici..."></div>

            </div>

            <!-- PANNEAU APERÇU -->
            <div class="panel panel-right">
                <div class="mb-4 flex items-center justify-between">
                    <h3 class="font-fredoka text-[#1A1A1A] font-bold text-lg">Aperçu du rendu final</h3>
                    <span id="badge-mode" class="px-2 py-1 bg-green-100 text-green-700 text-[10px] font-bold rounded uppercase">Mode Newsletter</span>
                </div>
                
                <div class="preview-box">
                    <div class="preview-header">
                        <span class="text-xs font-medium text-slate-300">Boîte de réception - Aperçu</span>
                        <div class="flex gap-2">
                            <div class="w-3 h-3 rounded-full bg-slate-600"></div>
                            <div class="w-3 h-3 rounded-full bg-slate-600"></div>
                            <div class="w-3 h-3 rounded-full bg-slate-600"></div>
                        </div>
                    </div>
                    <div id="preview-output" class="preview-content"></div>
                </div>
            </div>

        </div>
    </div>

    <!-- SCRIPT DE LA SIDEBAR UNIFIÉE -->
    <script src="../js/sidebar.js"></script>

    <script>
        let modeActuel = 'newsletter'; // 'newsletter' ou 'mail'
        const memoireContenu = {
            newsletter: '',
            mail: ''
        };

        const editor = document.getElementById('editor');
        const previewOutput = document.getElementById('preview-output');

        const BLOC_HEADER = `
            <table width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-bottom: 25px; border-bottom: 2px solid #C41E3A;">
                <tr>
                    <td width="80" valign="middle" style="padding-bottom: 16px;">
                        <table cellpadding="0" cellspacing="0" border="0" style="background-color: #C41E3A; width: 68px; height: 68px; border-radius: 12px;">
                            <tr>
                                <td align="center" valign="middle" style="padding: 6px;">
                                    <img src="https://dojodornois.fr/public/10057/upload/files/base-de-donnees/logo-dojo-dornois-transparent-contour-blanc_2.png" style="width: 56px; height: 56px; display: block; border: 0;" alt="Logo Dojo">
                                </td>
                            </tr>
                        </table>
                    </td>
                    <td valign="middle" style="padding-left: 15px; padding-bottom: 16px;">
                        <h1 style="font-family: 'Fredoka', sans-serif; font-size: 22px; color: #C41E3A; margin: 0; text-transform: uppercase;">DOJO DORNOIS</h1>
                        <p style="font-family: 'Roboto', Arial, sans-serif; font-size: 13px; color: #6B6B6B; margin: 5px 0 0 0;">Communication officielle</p>
                    </td>
                </tr>
            </table>
        `;

        const BLOC_FOOTER = `
            <table width="100%" cellpadding="0" cellspacing="0" border="0" style="border-top: 2px solid #E8E8E8; margin-top: 30px;">
                <tr>
                    <td align="center" style="padding-top: 20px; padding-bottom: 12px;">
                        <table cellpadding="0" cellspacing="0" border="0" style="background-color: #C41E3A; width: 60px; height: 60px; border-radius: 10px; margin: 0 auto;">
                            <tr>
                                <td align="center" valign="middle" style="padding: 5px;">
                                    <img src="https://dojodornois.fr/public/10057/upload/files/base-de-donnees/logo-dojo-dornois-transparent-contour-blanc_2.png" style="width: 50px; height: 50px; display: block; border: 0;" alt="Logo Dojo">
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td align="center" style="font-family: 'Roboto', Arial, sans-serif; font-size: 12px; color: #6B6B6B; line-height: 1.5; text-align: center;">
                        <strong style="color: #C41E3A; font-size: 14px; font-family: 'Fredoka', sans-serif; text-transform: uppercase;">DOJO DORNOIS</strong><br>
                        1 Place de la Mairie, 58390 Dornes<br>
                        dojodornois@gmail.com | 06.07.13.91.86<br>
                        <span style="font-size: 10px; color: #B8B8B8;">SIRET 45192841000013 &bull; RNA W583001220</span>
                    </td>
                </tr>
            </table>
        `;

        function changerOnglet(onglet) {
            memoireContenu[modeActuel] = editor.innerHTML;
            modeActuel = onglet;

            const btnNews = document.getElementById('tab-newsletter');
            const btnMail = document.getElementById('tab-mail');
            const grpModelesMails = document.getElementById('group-modeles-mails');
            const grpModNews = document.getElementById('group-modules-newsletter');
            const grpModMail = document.getElementById('group-modules-mail');
            const badge = document.getElementById('badge-mode');
            const subtitle = document.getElementById('header-subtitle');

            if (onglet === 'newsletter') {
                btnNews.classList.add('active');
                btnMail.classList.remove('active');
                grpModelesMails.classList.add('hidden');
                grpModNews.classList.remove('hidden');
                grpModMail.classList.add('hidden');
                badge.className = "px-2 py-1 bg-green-100 text-green-700 text-[10px] font-bold rounded uppercase";
                badge.innerText = "Mode Newsletter";
                subtitle.innerText = "Création visuelle de gabarits HTML (Compatibilité Gmail & Kalisport)";
                editor.setAttribute('placeholder', "Rédigez ici ou insérez l'en-tête depuis le menu 'Insérer un bloc'...");
                editor.innerHTML = memoireContenu.newsletter;
            } else {
                btnMail.classList.add('active');
                btnNews.classList.remove('active');
                grpModelesMails.classList.remove('hidden');
                grpModNews.classList.add('hidden');
                grpModMail.classList.remove('hidden');
                badge.className = "px-2 py-1 bg-blue-100 text-blue-700 text-[10px] font-bold rounded uppercase";
                badge.innerText = "Format Gmail / Mail";
                subtitle.innerText = "Mise en page de courriels professionnels et réponses rapides pour Gmail";
                editor.setAttribute('placeholder', "Rédigez votre courriel...");
                
                if (!memoireContenu.mail) {
                    chargerGabarit('reponse_officielle');
                } else {
                    editor.innerHTML = memoireContenu.mail;
                }
            }

            genererApercu();
        }

        function format(cmd, value = null) {
            document.execCommand(cmd, false, value);
            editor.focus();
            genererApercu();
        }

        function ajouterLien() {
            const url = prompt("Entrez l'URL du lien :");
            if (url) format('createLink', url);
        }

        function ajouterImage() {
            const url = prompt("Collez l'URL publique de l'image :");
            if (url) {
                const htmlImage = `
                    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="margin: 15px 0;">
                        <tr>
                            <td align="center">
                                <img src="${url}" style="max-width: 100%; height: auto; border-radius: 8px; border: 1px solid #E8E8E8; display: block;" alt="Illustration">
                            </td>
                        </tr>
                    </table><br>
                `;
                format('insertHTML', htmlImage);
            }
        }

        function chargerGabarit(type) {
            let corpsTexte = '';

            switch(type) {
                case 'reponse_officielle':
                    corpsTexte = `
                        <p style="text-align: justify;">Bonjour [Nom / Prénom],</p>
                        <p style="text-align: justify;">Je fais suite à votre demande concernant [Sujet de la demande].</p>
                        <p style="text-align: justify;">Nous vous confirmons la bonne prise en compte de votre dossier. Vous trouverez ci-dessous le détail des éléments :</p>
                        <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #F8FAFC; border: 1px solid #E8E8E8; border-radius: 6px; margin: 15px 0;">
                            <tr>
                                <td style="padding: 15px; font-family: 'Roboto', Arial, sans-serif; font-size: 14px; color: #3D3D3D; text-align: justify;">
                                    <strong>Récapitulatif :</strong><br>
                                    • Éléments reçus : [Dossier complet / Pièces à fournir]<br>
                                    • Statut actuel : [En cours de traitement]<br>
                                    • Prochaine étape : [Prochaine action]
                                </td>
                            </tr>
                        </table>
                        <p style="text-align: justify;">N'hésitez pas à revenir vers nous si vous avez la moindre question complémentaire.</p>
                        <p style="text-align: justify;">Bien cordialement,</p>
                    `;
                    break;

                case 'relance_adhesion':
                    corpsTexte = `
                        <p style="text-align: justify;">Bonjour [Prénom],</p>
                        <p style="text-align: justify;">Sauf erreur de notre part, nous n'avons pas encore reçu [la pièce manquante / le règlement] pour finaliser votre dossier d'inscription au Dojo Dornois.</p>
                        <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #FFEBEF; border-left: 4px solid #C41E3A; margin: 15px 0;">
                            <tr>
                                <td style="padding: 15px; font-family: 'Roboto', Arial, sans-serif; font-size: 14px; color: #8B1429; text-align: justify;">
                                    <strong style="color: #C41E3A; font-family: 'Fredoka', sans-serif;">RAPPEL :</strong> Pour des raisons d'assurance sur les tatamis, nous avons besoin de compléter votre dossier avant le [Date limite].
                                </td>
                            </tr>
                        </table>
                        <p style="text-align: justify;">Vous pouvez nous faire parvenir les documents directement par retour de mail ou lors de la prochaine séance d'entraînement.</p>
                        <p style="text-align: justify;">Merci pour votre réactivité et à très vite au dojo !</p>
                    `;
                    break;

                case 'convocation_reunion':
                    corpsTexte = `
                        <h2>CONVOCATION À LA RÉUNION</h2>
                        <p style="text-align: justify;">Bonjour à toutes et à tous,</p>
                        <p style="text-align: justify;">Vous êtes conviés à la prochaine réunion du club qui se tiendra selon les modalités ci-dessous :</p>
                        <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #F8FAFC; border: 1px solid #E8E8E8; border-radius: 6px; margin: 15px 0;">
                            <tr>
                                <td style="padding: 15px; font-family: 'Roboto', Arial, sans-serif; font-size: 14px; color: #3D3D3D; text-align: justify;">
                                    📅 <strong>Date :</strong> [Date de la réunion]<br>
                                    ⏰ <strong>Heure :</strong> [Heure de début] - [Heure de fin]<br>
                                    📍 <strong>Lieu :</strong> [Lieu de rendez-vous]
                                </td>
                            </tr>
                        </table>
                        <h2>Ordre du jour :</h2>
                        <ul style="text-align: justify;">
                            <li>Point 1 : Point financier et administratif</li>
                            <li>Point 2 : Prochains événements et logistique</li>
                            <li>Point 3 : Questions diverses</li>
                        </ul>
                        <p style="text-align: justify;">Merci de nous confirmer votre présence par retour de mail.</p>
                    `;
                    break;

                case 'texte_vide':
                    corpsTexte = `<p style="text-align: justify;">Rédigez votre message ici...</p>`;
                    break;
            }

            editor.innerHTML = BLOC_HEADER + `<div id="mail-body" style="padding: 15px 0; text-align: justify;">${corpsTexte}</div>` + BLOC_FOOTER;
            genererApercu();
        }

        function insererModule(type) {
            let htmlBloc = '';
            
            switch(type) {
                case 'header_officiel':
                    htmlBloc = `
                        <table width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-bottom: 25px; border-bottom: 2px solid #C41E3A;">
                            <tr>
                                <td width="80" valign="middle" style="padding-bottom: 16px;">

        function getCodeFinal() {
            let contenu = editor.innerHTML;
            
            contenu = contenu.replace(/<h1>/g, '<h1 style="font-family: \'Fredoka\', sans-serif; font-size: 24px; color: #C41E3A; margin-top: 0; margin-bottom: 15px; text-align: left;">');
            contenu = contenu.replace(/<h2>/g, '<h2 style="font-family: \'Fredoka\', sans-serif; font-size: 20px; color: #1A1A1A; margin-top: 0; margin-bottom: 12px; text-align: left;">');
            contenu = contenu.replace(/<h3>/g, '<h3 style="font-family: \'Fredoka\', sans-serif; font-size: 18px; color: #1A1A1A; margin-top: 0; margin-bottom: 10px; text-align: left;">');
            contenu = contenu.replace(/<p>/g, '<p style="margin-top: 0; margin-bottom: 15px; line-height: 1.6;">');

            const texteInvisible = modeActuel === 'newsletter' ? 'Actualités du Dojo Dornois' : 'Message du Dojo Dornois';

            return `
                <div style="display:none;font-size:1px;color:#F4F6F9;line-height:1px;max-height:0px;max-width:0px;opacity:0;overflow:hidden;">${texteInvisible}</div>
                <style>
                    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Roboto:wght@400;500&display=swap');
                </style>
                <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #F4F6F9; padding: 20px 0;">
                    <tr>
                        <td align="center">
                            <!--[if mso]>
                            <table width="650" cellpadding="0" cellspacing="0" border="0"><tr><td>
                            <![endif]-->
                            <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #FFFFFF; max-width: 650px; width: 100%; border: 1px solid #E8E8E8; border-radius: 8px; margin: auto;">
                                <tr>
                                    <td style="padding: 30px; font-family: 'Roboto', Arial, sans-serif; font-size: 15px; color: #3D3D3D; line-height: 1.6;">
                                        ${contenu}
                                    </td>
                                </tr>
                            </table>
                            <!--[if mso]>
                            </td></tr></table>
                            <![endif]-->
                        </td>
                    </tr>
                </table>
            `;
        }

        function genererApercu() {
            previewOutput.innerHTML = getCodeFinal();
        }

        function copierCodeHTML() {
            genererApercu();
            navigator.clipboard.writeText(getCodeFinal()).then(() => {
                const message = modeActuel === 'newsletter' 
                    ? "✅ Code HTML copié ! Prêt à être collé dans le code source de Kalisport." 
                    : "✅ Code HTML copié ! Prêt à être collé.";
                alert(message);
            }).catch(err => {
                alert("Erreur lors de la copie.");
            });
        }

        function copierRichText() {
            genererApercu();
            const target = document.getElementById('preview-output');
            
            if (!target.innerHTML.trim()) return alert("L'éditeur est vide.");
            
            const range = document.createRange();
            range.selectNode(target);
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
            
            try {
                document.execCommand("copy");
                alert("✅ Rendu visuel copié ! Prêt à être collé dans Gmail.");
            } catch (err) {
                alert("Erreur lors de la copie.");
            }
            selection.removeAllRanges();
        }

        editor.addEventListener('input', () => {
            memoireContenu[modeActuel] = editor.innerHTML;
            genererApercu();
        });

        window.onload = function() {
            genererApercu();
        };

    </script>
