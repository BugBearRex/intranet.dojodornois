<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Méga Générateur Kalisport & Gmail — Dojo Dornois</title>

    <!-- POLICES OFFICIELLES CHARTE DOJO DORNOIS -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- TAILWIND CSS & FONTAWESOME -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --rouge: #C41E3A;
            --rouge-hover: #A3182E;
            --rouge-clair: #FFEBEF;
            --noir-doux: #1A1A1A;
            --gris-fonce: #3D3D3D;
            --gris-moyen: #6B6B6B;
            --gris-clair: #B8B8B8;
            --gris-tres-clair: #E8E8E8;
            --fond: #F4F6F9;
            --blanc: #FFFFFF;
            --sidebar-width: 270px;
            --topbar-height: 68px;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--fond);
            color: var(--gris-fonce);
            margin: 0; padding: 0;
            font-size: 13px;
            display: flex; height: 100vh; overflow: hidden;
        }

        h1, h2, h3, h4, .font-fredoka { font-family: 'Fredoka', sans-serif; }
        code, pre, .font-mono { font-family: 'Roboto Mono', monospace; }

        .sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            max-width: var(--sidebar-width);
            background: var(--noir-doux);
            color: var(--blanc);
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
            box-shadow: 4px 0 15px rgba(0,0,0,0.1);
            flex-shrink: 0;
            overflow-x: hidden;
            z-index: 100;
        }

        .tab-btn-main {
            font-family: 'Fredoka', sans-serif;
            font-size: 0.95rem;
            padding: 10px 18px;
            border-bottom: 3px solid transparent;
            color: var(--gris-moyen);
            transition: all 0.2s ease;
        }
        .tab-btn-main.active {
            color: var(--rouge);
            border-bottom-color: var(--rouge);
            background: white;
            font-weight: 700;
        }

        .input-field {
            width: 100%;
            padding: 8px 11px;
            border: 1px solid var(--gris-tres-clair);
            background: #F8FAFC;
            border-radius: 6px;
            font-size: 12px;
            outline: none;
            transition: border-color 0.2s ease;
        }
        .input-field:focus {
            border-color: var(--rouge);
            background: #FFFFFF;
        }

        .source-textarea {
            width: 100%;
            height: 100%;
            padding: 16px;
            background: #1E293B;
            color: #F8FAFC;
            font-family: 'Roboto Mono', monospace;
            font-size: 11.5px;
            line-height: 1.5;
            border: none;
            outline: none;
            resize: none;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="h-full flex text-slate-800 antialiased">

    <!-- SIDEBAR UNIFIÉE -->
    <div class="sidebar no-print"></div>

    <!-- MAIN CONTAINER -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden h-screen">
        
        <!-- TOPBAR -->
        <header class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-[#C41E3A] text-white flex items-center justify-center font-bold font-fredoka text-xl shadow-md">
                    🥋
                </div>
                <div>
                    <h1 class="font-fredoka text-lg font-bold text-[#1A1A1A]">Méga Générateur de Codes Kalisport &amp; Gmail</h1>
                    <p class="text-xs text-slate-500">Convocations, articles, fiches boutique &amp; courriels enrichis</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <button onclick="copierCodeSourceKalisport()" class="px-3.5 py-2 bg-[#1A1A1A] hover:bg-slate-800 text-white rounded-lg text-xs font-bold flex items-center gap-2 transition shadow-sm" title="Coller dans le mode source de Kalisport">
                    <i class="fa-solid fa-code text-amber-400"></i> Copier pour Kalisport (Code Source)
                </button>
                <button onclick="copierRenduPourGmail()" class="px-3.5 py-2 bg-[#C41E3A] hover:bg-[#A3182E] text-white rounded-lg text-xs font-bold flex items-center gap-2 transition shadow-sm" title="Coller directement dans le corps d'un e-mail Gmail">
                    <i class="fa-brands fa-google text-white"></i> Copier pour Gmail (Visuel)
                </button>
                <a href="../index.html" class="px-3 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg text-xs font-bold transition">
                    🏠 Central
                </a>
            </div>
        </header>

        <!-- BARRE DES ONGLETS MAÎTRES -->
        <div class="bg-slate-100 border-b border-slate-200 px-6 flex justify-between items-center shrink-0">
            <div class="flex gap-2">
                <button onclick="changerModule('messages')" id="tab-btn-messages" class="tab-btn-main active flex items-center gap-2">
                    <i class="fa-solid fa-bullhorn text-[#C41E3A]"></i> 1. Messages &amp; Convocations
                </button>
                <button onclick="changerModule('articles')" id="tab-btn-articles" class="tab-btn-main flex items-center gap-2">
                    <i class="fa-solid fa-newspaper"></i> 2. Articles d'Actualité
                </button>
                <button onclick="changerModule('boutique')" id="tab-btn-boutique" class="tab-btn-main flex items-center gap-2">
                    <i class="fa-solid fa-store"></i> 3. Fiches Boutique
                </button>
            </div>
            <button id="btn-toggle-source" onclick="basculerModeCodeSource()" class="px-3 py-1.5 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 rounded-md text-xs font-bold flex items-center gap-1.5 shadow-sm transition">
                <i class="fa-solid fa-code text-[#C41E3A]"></i> <span>Éditer le Code Source</span>
            </button>
        </div>

        <!-- ESPACE DE TRAVAIL SPLIT (FORMULAIRE / APERÇU) -->
        <div class="flex-1 flex overflow-hidden p-4 gap-4">
            
            <!-- COLONNE GAUCHE : FORMULAIRES DE CONFIGURATION OU ÉDITEUR CODE SOURCE -->
            <div class="w-5/12 bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col overflow-hidden">
                
                <!-- ZONE FORMULAIRES -->
                <div id="conteneur-formulaires" class="flex-1 overflow-y-auto p-4 space-y-4">
                    
                    <!-- ================= SOUS-FORMULAIRE 1 : MESSAGES & CONVOCATIONS ================= -->
                    <div id="form-module-messages" class="space-y-4">
                        <div class="p-2 bg-slate-50 border border-slate-200 rounded-lg flex gap-2">
                            <button id="msg-mode-debut" onclick="setModeMessage('debut')" class="flex-1 py-1.5 px-3 rounded-md text-xs font-bold font-fredoka bg-[#C41E3A] text-white">
                                📢 1. Début / Convocation
                            </button>
                            <button id="msg-mode-fin" onclick="setModeMessage('fin')" class="flex-1 py-1.5 px-3 rounded-md text-xs font-bold font-fredoka bg-white text-slate-600 border border-slate-200 hover:bg-slate-100">
                                📸 2. Fin / Résumé &amp; Bilan
                            </button>
                        </div>

                        <div class="bg-slate-50 border border-slate-200 rounded-lg p-2.5 flex items-center justify-between">
                            <span class="text-[11px] font-bold text-slate-700"><i class="fa-solid fa-palette text-slate-600 mr-1"></i> Couleur du thème :</span>
                            <div class="flex items-center gap-2">
                                <input type="color" id="msg-color" value="#C41E3A" onchange="actualiserRendu()" class="w-7 h-7 rounded border cursor-pointer bg-transparent">
                                <span id="msg-color-hex" class="font-mono text-[11px] text-slate-500 font-bold">#C41E3A</span>
                            </div>
                        </div>

                        <div class="grid grid-cols-4 gap-2">
                            <div>
                                <label class="block text-[11px] font-bold text-slate-700 mb-1">Émoji</label>
                                <input type="text" id="msg-emoji" value="🥋" oninput="actualiserRendu()" class="input-field text-center text-sm font-bold">
                            </div>
                            <div class="col-span-3">
                                <label class="block text-[11px] font-bold text-slate-700 mb-1">Titre de l'Événement</label>
                                <input type="text" id="msg-titre" value="STAGE MULTI-ACTIVITÉS DU DOJO" oninput="actualiserRendu()" class="input-field font-bold">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[11px] font-bold text-slate-700 mb-1">Sous-titre</label>
                                <input type="text" id="msg-soustitre" value="Dojo Dornois • Événement Club" oninput="actualiserRendu()" class="input-field">
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold text-slate-700 mb-1">Badge Date / Tag</label>
                                <input type="text" id="msg-date" value="📅 Mercredi 12 Août 2026" oninput="actualiserRendu()" class="input-field">
                            </div>
                        </div>

                        <div>
                            <label class="block text-[11px] font-bold text-slate-700 mb-1">Texte d'Introduction</label>
                            <textarea id="msg-intro" rows="3" oninput="actualiserRendu()" class="input-field">Bonjour à tous ! Un stage multi-activités est organisé pour vos enfants. C'est l'occasion idéale pour eux de partager un moment convivial sur les tapis autour du judo et de jeux ludiques. Le stage est gratuit pour les licenciés du Dojo.</textarea>
                        </div>

                        <div class="border border-slate-200 rounded-lg p-3 bg-slate-50 space-y-2">
                            <label class="block text-[11px] font-bold text-[#C41E3A] uppercase font-fredoka">⏰ Programme / Points clés (1 par ligne)</label>
                            <input type="text" id="msg-bloctitre" value="⏰ Programme de la journée :" oninput="actualiserRendu()" class="input-field font-bold mb-1">
                            <textarea id="msg-liste" rows="4" oninput="actualiserRendu()" class="input-field">09h45 • 10h00 : Accueil des participants au dojo
10h00 • 12h00 : Session Judo & activités ludiques sur le tatami
12h00 • 14h00 : Pause repas (Pique-nique apporté par les enfants • Boissons fournies)
14h00 • 16h00 : Grands jeux & animations l'après-midi</textarea>
                        </div>

                        <div class="border border-amber-200 rounded-lg p-3 bg-amber-50/60 space-y-2">
                            <label class="block text-[11px] font-bold text-amber-800 uppercase font-fredoka">⚠️ Message d'alerte &amp; Inscription</label>
                            <textarea id="msg-alerte" rows="3" oninput="actualiserRendu()" class="input-field">Organisation & Logistique :
Merci de bien vouloir valider la présence ou l'absence de votre enfant directement via cette convocation pour ajuster l'encadrement.

Remarque : Si vous ne souhaitez pas renseigner d'adresse email, indiquez simplement sansmail@dojo.fr dans le champ requis.</textarea>
                        </div>

                        <div id="msg-conditions-box" class="border border-sky-200 rounded-lg p-3 bg-sky-50/60 space-y-2">
                            <label class="block text-[11px] font-bold text-sky-800 uppercase font-fredoka">ℹ️ Conditions de maintien</label>
                            <textarea id="msg-conditions" rows="2" oninput="actualiserRendu()" class="input-field">Pour que le stage puisse se dérouler, un minimum de 6 participants est requis. 
Sous réserve de conditions météo favorables (annulation possible en cas de forte canicule ou orages).</textarea>
                        </div>
                    </div>

                    <!-- ================= SOUS-FORMULAIRE 2 : ARTICLES D'ACTUALITÉ ================= -->
                    <div id="form-module-articles" class="space-y-4 hidden">
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Date de parution</label>
                                <input type="text" id="art-date" class="input-field" value="28 Juillet 2026" oninput="actualiserRendu()">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Discipline / Rubrique</label>
                                <input type="text" id="art-cat" class="input-field" value="Judo • Compétition" oninput="actualiserRendu()">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Titre de l'article</label>
                            <input type="text" id="art-titre" class="input-field font-semibold" value="Superbes résultats au tournoi de Nevers" oninput="actualiserRendu()">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Texte d'introduction (Liseré rouge)</label>
                            <textarea id="art-intro" rows="2" class="input-field" oninput="actualiserRendu()">Le week-end dernier, nos judokas ont fièrement représenté le club lors du tournoi régional de Nevers. Retour en images et en chiffres sur cette belle journée.</textarea>
                        </div>

                        <div class="p-3 bg-slate-50 border border-slate-200 rounded-lg space-y-2">
                            <label class="block text-xs font-bold text-slate-800">📸 Image principale (Optionnelle)</label>
                            <input type="text" id="art-img" class="input-field" placeholder="Collez l'URL publique de l'image (ou laissez vide)" oninput="actualiserRendu()">
                            <input type="text" id="art-caption" class="input-field" placeholder="Légende de la photo" value="📷 Remise des récompenses sur le podium." oninput="actualiserRendu()">
                        </div>

                        <div class="space-y-2">
                            <div class="flex items-center justify-between">
                                <label class="block text-xs font-bold text-slate-800">📝 Paragraphes du corps de l'article</label>
                                <button type="button" onclick="ajouterSectionArticle()" class="px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded text-xs font-medium border">
                                    <i class="fa-solid fa-plus text-[#C41E3A]"></i> + Bloc
                                </button>
                            </div>
                            <div id="liste-sections-article" class="space-y-3"></div>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Encadré Focus / Citation (Optionnel)</label>
                            <textarea id="art-focus" rows="2" class="input-field" oninput="actualiserRendu()">💡 À retenir : Prochain rendez-vous le samedi 15 août pour l'entraînement commun de rentrée au dojo municipal !</textarea>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Message de conclusion</label>
                                <input type="text" id="art-closing" class="input-field" value="À très bientôt sur les tatamis ! 👋" oninput="actualiserRendu()">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Signature</label>
                                <input type="text" id="art-sig" class="input-field" value="🥋 L'équipe du Dojo Dornois" oninput="actualiserRendu()">
                            </div>
                        </div>
                    </div>

                    <!-- ================= SOUS-FORMULAIRE 3 : FICHES BOUTIQUE CHARTE MASTER ================= -->
                    <div id="form-module-boutique" class="space-y-4 hidden">
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Nom du produit &amp; Réf.</label>
                                <input type="text" id="prod-nom" class="input-field font-semibold" value="Basic-T - 029030" oninput="actualiserRendu()">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Prix Adhérent</label>
                                <input type="text" id="prod-prix" class="input-field font-semibold" value="10,00 €" oninput="actualiserRendu()">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Catégorie (Bandeau noir)</label>
                                <input type="text" id="prod-cat" class="input-field" value="Textile Club" oninput="actualiserRendu()">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Badge d'accroche (Pillule)</label>
                                <input type="text" id="prod-tagline" class="input-field" value="🔥 BEST SELLER • T-shirt unisexe" oninput="actualiserRendu()">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Atouts &amp; Finitions (1 ligne = 1 puce verte)</label>
                            <textarea id="prod-points" rows="3" class="input-field" oninput="actualiserRendu()">Bande de propreté renforcée au col
Col avec élasthanne pour une excellente tenue
Coupe et taille standards européennes</textarea>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Composition / Matière</label>
                                <input type="text" id="prod-qualite" class="input-field" value="100% coton de qualité" oninput="actualiserRendu()">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Grammage / Poids</label>
                                <input type="text" id="prod-poids" class="input-field" value="145 g/m²" oninput="actualiserRendu()">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Tailles disponibles</label>
                                <input type="text" id="prod-tailles" class="input-field" value="du XS au 4XL" oninput="actualiserRendu()">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Coloris officiel</label>
                                <input type="text" id="prod-couleurs" class="input-field" value="00 (Blanc officiel)" oninput="actualiserRendu()">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Marquage Officiel Inclus</label>
                            <textarea id="prod-marquage" rows="2" class="input-field" oninput="actualiserRendu()">Ce vêtement inclut l'impression officielle du logo du Dojo Dornois côté cœur et le rappel de nos partenaires en contre-cœur.</textarea>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Délai Fournisseur &amp; Retrait</label>
                            <input type="text" id="prod-fournisseur" class="input-field" value="Commandes groupées validées le 1er et 15 de chaque mois auprès du fournisseur." oninput="actualiserRendu()">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Boutons Liens Déclinaisons (Format: Nom | URL)</label>
                            <textarea id="prod-liens" rows="2" class="input-field" oninput="actualiserRendu()">👚 Modèle Femme | https://dojodornois.fr/produits/basic-t-femme
🧒 Modèle Enfant / Junior | https://dojodornois.fr/produits/basic-t-junior</textarea>
                        </div>
                    </div>

                </div>

                <!-- ZONE ÉDITEUR CODE SOURCE COMPLET (BASCULE) -->
                <div id="conteneur-code-source" class="flex-1 hidden">
                    <textarea id="editeur-code-source-direct" class="source-textarea" placeholder="Collez ou modifiez directement votre code HTML ici..." oninput="actualiserRenduDepuisCodeSource()"></textarea>
                </div>
            </div>

            <!-- COLONNE DROITE : APERÇU EN DIRECT ET CODE BRUT COPIABLE -->
            <div class="w-7/12 flex flex-col gap-4 overflow-hidden">
                
                <!-- APERÇU VISUEL -->
                <div class="flex-1 bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col overflow-hidden">
                    <div class="p-3 bg-slate-50 border-b border-slate-200 flex justify-between items-center shrink-0">
                        <span class="font-fredoka text-xs font-bold text-slate-700 flex items-center gap-2">
                            <i class="fa-solid fa-eye text-[#C41E3A]"></i> Aperçu en Direct (Rendu Kalisport &amp; Gmail)
                        </span>
                        <div class="flex gap-2">
                            <button onclick="copierRenduPourGmail()" class="text-[11px] font-bold text-[#C41E3A] hover:underline flex items-center gap-1">
                                <i class="fa-brands fa-google"></i> Copier Visuel Gmail
                            </button>
                        </div>
                    </div>
                    <div class="flex-1 p-5 overflow-y-auto bg-slate-100 flex justify-center items-start">
                        <div id="zone-rendu-visuel" class="w-full max-w-[680px]"></div>
                    </div>
                </div>

                <!-- CODE BRUT COPIABLE EN TEMPS RÉEL -->
                <div class="h-2/5 bg-slate-900 rounded-xl shadow-sm border border-slate-800 flex flex-col overflow-hidden shrink-0">
                    <div class="p-2.5 bg-slate-950 border-b border-slate-800 flex justify-between items-center px-4">
                        <span class="font-mono text-xs font-bold text-slate-300 flex items-center gap-2">
                            <i class="fa-solid fa-code text-amber-400"></i> Code Source HTML (Prêt pour Kalisport)
                        </span>
                        <button onclick="copierCodeSourceKalisport()" id="btn-copy-code" class="px-3 py-1 bg-[#C41E3A] hover:bg-[#A3182E] text-white text-xs font-bold rounded flex items-center gap-1.5 transition shadow-sm">
                            <i class="fa-solid fa-copy"></i> Copier le Code
                        </button>
                    </div>
                    <div class="flex-1 p-3 overflow-y-auto">
                        <textarea id="zone-code-brut" readonly class="w-full h-full bg-transparent text-slate-200 font-mono text-[11px] border-none outline-none resize-none leading-relaxed"></textarea>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <!-- SCRIPT SIDEBAR UNIFIÉE -->
    <script src="../js/sidebar.js"></script>

    <script>
        let moduleActif = 'messages'; // 'messages', 'articles', 'boutique'
        let modeMessage = 'debut';     // 'debut' ou 'fin'
        let modeCodeSourceActif = false;
        let codeManuelModifie = false;

        let sectionsArticle = [
            {
                titre: "Un événement marquant",
                texte: "Le week-end dernier, nos judokas ont participé au tournoi régional de Nevers. Une ambiance électrique, des combats intenses, et surtout une magnifique cohésion d'équipe sur et en dehors des tatamis."
            },
            {
                titre: "Des résultats prometteurs",
                texte: "Nos jeunes ont particulièrement brillé lors de cette édition : trois podiums décrochés de haute lutte, dont une superbe première place pour Hugo. Bravo à tous pour leur engagement et le respect du code moral !"
            }
        ];

        function changerModule(mod) {
            if (modeCodeSourceActif) basculerModeCodeSource();
            codeManuelModifie = false;
            moduleActif = mod;

            ['messages', 'articles', 'boutique'].forEach(m => {
                document.getElementById(`tab-btn-${m}`).classList.remove('active');

        function echapper(str) {
            return (str || '')
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function hexToRgba(hex, alpha) {
            let c = hex.replace('#', '');
            if (c.length === 3) c = c.split('').map(x => x + x).join('');
            const num = parseInt(c, 16);
            return `rgba(${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255}, ${alpha})`;
        }

  </div>

  <div style="background:#FAFAFA; border-top:1px solid #EAEAEA; padding:10px 20px; font-size:0.75rem; color:#6B6B6B; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
    <div><strong>Dojo Dornois</strong> • Dornes (58390) • FFJDA CE 08.58.067.0</div>
    <div style="color:#C41E3A; font-weight:bold;">dojodornois.fr</div>
  </div>

</div>`;
        }

        // ================= GESTION GLOBALE RENDU ET COPIE =================
        function genererCodeCourant() {
            if (moduleActif === 'messages') return genererCodeMessage();
            if (moduleActif === 'articles') return genererCodeArticle();
            if (moduleActif === 'boutique') return genererCodeBoutique();
            return '';
        }

        function actualiserRendu() {
            if (modeCodeSourceActif) return;
            const code = genererCodeCourant();
            document.getElementById('zone-rendu-visuel').innerHTML = code;
            document.getElementById('zone-code-brut').value = code;
        }

        function actualiserRenduDepuisCodeSource() {
            codeManuelModifie = true;
            const code = document.getElementById('editeur-code-source-direct').value;
            document.getElementById('zone-rendu-visuel').innerHTML = code;
            document.getElementById('zone-code-brut').value = code;
        }

        function copierCodeSourceKalisport() {
            const code = (modeCodeSourceActif || codeManuelModifie)
                ? document.getElementById('editeur-code-source-direct').value
                : genererCodeCourant();

            navigator.clipboard.writeText(code).then(() => {
                const btn = document.getElementById('btn-copy-code');
                btn.innerHTML = '<i class="fa-solid fa-check"></i> Code Copié !';
                btn.classList.add('bg-blue-600');
                setTimeout(() => {
                    btn.innerHTML = '<i class="fa-solid fa-copy"></i> Copier le Code';
                    btn.classList.remove('bg-blue-600');
                }, 2000);
            }).catch(() => alert("Erreur lors de la copie du code source."));
        }

        function copierRenduPourGmail() {
            const cible = document.getElementById('zone-rendu-visuel');
            if (!cible || !cible.innerHTML.trim()) return alert("Aucun contenu à copier.");

            const range = document.createRange();
            range.selectNode(cible);
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);

            try {
                document.execCommand('copy');
                alert("✅ Rendu visuel copié ! Vous pouvez directement le coller (Ctrl+V) dans Gmail.");
            } catch (err) {
                alert("Erreur lors de la copie pour Gmail.");
            }
            selection.removeAllRanges();
        }

        // GESTION DES SECTIONS DE L'ARTICLE
        function rendreSectionsArticleForm() {
            const conteneur = document.getElementById('liste-sections-article');
            conteneur.innerHTML = '';

            sectionsArticle.forEach((sec, idx) => {
                const b = document.createElement('div');
                b.className = 'p-3 bg-slate-50 border border-slate-200 rounded-lg space-y-2';
                b.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="text-[11px] font-bold text-slate-600">Paragraphe ${idx + 1}</span>
                        <div class="flex gap-1">
                            ${idx > 0 ? `<button type="button" onclick="deplacerSectionArticle(${idx}, -1)" class="px-1.5 py-0.5 text-slate-500 hover:text-slate-800 text-xs"><i class="fa-solid fa-arrow-up"></i></button>` : ''}
                            ${idx < sectionsArticle.length - 1 ? `<button type="button" onclick="deplacerSectionArticle(${idx}, 1)" class="px-1.5 py-0.5 text-slate-500 hover:text-slate-800 text-xs"><i class="fa-solid fa-arrow-down"></i></button>` : ''}
                            <button type="button" onclick="supprimerSectionArticle(${idx})" class="px-1.5 py-0.5 text-rose-600 hover:text-rose-800 text-xs"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                    <input type="text" class="input-field font-semibold text-xs mb-1" placeholder="Sous-titre (Optionnel)" value="${echapper(sec.titre)}" oninput="modifierSectionArticle(${idx}, 'titre', this.value)">
                    <textarea rows="2" class="input-field text-xs" placeholder="Texte du paragraphe..." oninput="modifierSectionArticle(${idx}, 'texte', this.value)">${echapper(sec.texte)}</textarea>
                `;
                conteneur.appendChild(b);
            });
        }

        function ajouterSectionArticle() {
            sectionsArticle.push({ titre: "", texte: "" });
            rendreSectionsArticleForm();
            codeManuelModifie = false;
            actualiserRendu();
        }

        function supprimerSectionArticle(idx) {
            if (sectionsArticle.length <= 1) sectionsArticle = [{ titre: "", texte: "" }];
            else sectionsArticle.splice(idx, 1);
            rendreSectionsArticleForm();
            codeManuelModifie = false;
            actualiserRendu();
        }

        function modifierSectionArticle(idx, champ, val) {
            sectionsArticle[idx][champ] = val;
            codeManuelModifie = false;
            actualiserRendu();
        }

        function deplacerSectionArticle(idx, dir) {
            const target = idx + dir;
            if (target >= 0 && target < sectionsArticle.length) {
                const tmp = sectionsArticle[idx];
                sectionsArticle[idx] = sectionsArticle[target];
                sectionsArticle[target] = tmp;
                rendreSectionsArticleForm();
                codeManuelModifie = false;
                actualiserRendu();
            }
        }

        // INITIALISATION
        window.addEventListener('DOMContentLoaded', () => {
            rendreSectionsArticleForm();
            actualiserRendu();
        });
    </script>
</body>
</html>
