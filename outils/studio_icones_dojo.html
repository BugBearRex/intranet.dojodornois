<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Studio Créateur d'Icônes — Dojo Dornois</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --rouge: #C41E3A;
            --rouge-hover: #A3182E;
            --rouge-clair: #FFEBEF;
            --noir-doux: #1A1A1A;
            --gris-fonce: #3D3D3D;
            --gris-moyen: #6B6B6B;
            --gris-clair: #B8B8B8;
            --gris-tres-clair: #E8E8E8;
            --fond: #2D2D2D;
            --blanc: #FFFFFF;
            --sidebar-width: 280px;
            --topbar-height: 68px;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--fond);
            margin: 0; padding: 0;
            color: var(--blanc);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar { 
            width: var(--sidebar-width); 
            min-width: var(--sidebar-width);
            max-width: var(--sidebar-width);
            background: var(--noir-doux); 
            color: var(--blanc); 
            display: flex; 
            flex-direction: column; 
            height: 100%; 
            position: relative; 
            box-shadow: 4px 0 15px rgba(0,0,0,0.1); 
            flex-shrink: 0; 
            box-sizing: border-box;
            overflow-x: hidden;
            z-index: 100;
        }

        .sidebar * {
            max-width: 100%;
            box-sizing: border-box;
        }

        .nav-link { display: flex; align-items: center; justify-content: flex-start !important; gap: 10px; padding: 9px 12px; color: var(--gris-clair); text-decoration: none; border-radius: 6px; font-weight: 500; font-size: 0.85rem; margin-bottom: 3px; }
        .nav-link:hover { background: rgba(255,255,255,0.08); color: var(--blanc); }
        .nav-link.active { background: var(--rouge); color: var(--blanc); font-weight: bold; }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; min-width: 0;
        }

        .topbar {
            background: #3D3D3D; height: var(--topbar-height); padding: 0 28px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #555; flex-shrink: 0; z-index: 50;
        }

        .page-title-area h2 { font-family: 'Fredoka', sans-serif; margin: 0; font-size: 1.35rem; color: var(--blanc); }
        .page-title-area h2 span { color: var(--rouge); }
        .page-title-area p { margin: 2px 0 0 0; font-size: 0.78rem; color: var(--gris-clair); }

        /* TAB SYSTEM */
        .tab-bar {
            display: flex;
            background: #252525;
            padding: 6px 28px;
            gap: 10px;
            border-bottom: 1px solid #444;
        }

        .tab-btn {
            background: #3D3D3D;
            color: var(--gris-clair);
            border: none;
            padding: 8px 16px;
            border-radius: 8px 8px 0 0;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            background: #4D4D4D;
            color: var(--blanc);
        }

        .tab-btn.active {
            background: var(--rouge);
            color: var(--blanc);
        }

        .tab-content {
            display: none;
            flex: 1;
            padding: 24px 28px;
            overflow-y: auto;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .btn { font-family: 'Roboto', sans-serif; font-weight: 500; padding: 9px 15px; border-radius: 6px; border: none; cursor: pointer; transition: background 0.2s; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
        .btn-dark { background: var(--noir-doux); color: white; }
        .btn-dark:hover { background: #111; }

        .studio-container {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            justify-content: center;
            align-items: flex-start;
            max-width: 1200px;
            width: 100%;
        }

        .config-panel {
            background-color: #3D3D3D;
            padding: 25px;
            border-radius: 20px;
            border: 2px solid var(--rouge);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 420px;
        }

        .config-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .config-group label {
            font-family: 'Fredoka', sans-serif;
            font-size: 11pt;
            color: #E8E8E8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .config-group input, .config-group select {
            font-family: 'Roboto', sans-serif;
            font-size: 12pt;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #555;
            background-color: #2D2D2D;
            color: #FFF;
        }

        .row-flex {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* PALETTE 40 COULEURS */
        .color-presets-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 6px;
            margin-top: 6px;
            background-color: #2D2D2D;
            padding: 8px;
            border-radius: 10px;
        }

        .color-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid #FFF;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .color-btn:hover { transform: scale(1.25); }

        .emoji-bar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            background-color: #2D2D2D;
            padding: 8px;
            border-radius: 8px;
        }

        .emoji-btn {
            font-size: 14pt;
            background: none;
            border: none;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .emoji-btn:hover { transform: scale(1.3); }

        .preview-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* --- BASE ICON CARD (DOSSIER 500x500) --- */
        .icon-card {
            width: 500px;
            height: 500px;
            background-color: #F5F5F5;
            border-radius: 60px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 35px 30px;
            position: relative;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        /* Modèles Dossiers */
        .icon-card.style-root .badge-header { color: #FFF; font-family: 'Fredoka', sans-serif; font-size: 20pt; font-weight: 700; text-transform: uppercase; padding: 8px 25px; border-radius: 50px; letter-spacing: 1px; box-shadow: 0 6px 15px rgba(0,0,0,0.15); text-align: center; max-width: 90%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .icon-card.style-tab { padding: 30px 30px 30px 55px; }
        .icon-card.style-tab::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 24px; background-color: #2563EB; }
        .icon-card.style-tab .badge-header { align-self: flex-start; background: none !important; font-family: 'Fredoka', sans-serif; font-size: 20pt; font-weight: 700; padding: 0; letter-spacing: 1px; }
        .icon-card.style-header-wave { padding-top: 0; }
        .icon-card.style-header-wave .badge-header { width: 100%; padding: 22px 20px 18px 20px; border-radius: 0 0 50% 50% / 0 0 25px 25px; color: #FFF; font-family: 'Fredoka', sans-serif; font-size: 20pt; font-weight: 700; text-align: center; box-shadow: 0 6px 15px rgba(0,0,0,0.15); }
        .icon-card.style-ribbon { padding: 40px 30px 30px 30px; }
        .icon-card.style-ribbon .badge-header { position: absolute; top: 32px; right: -45px; transform: rotate(45deg); width: 220px; text-align: center; font-family: 'Fredoka', sans-serif; font-size: 13pt; font-weight: 700; color: #FFF; padding: 6px 0; box-shadow: 0 4px 10px rgba(0,0,0,0.2); border-radius: 0; letter-spacing: 1px; }
        .icon-card.style-left-pill { padding: 30px 30px 30px 30px; }
        .icon-card.style-left-pill .badge-header { align-self: flex-start; color: #FFF; font-family: 'Fredoka', sans-serif; font-size: 16pt; font-weight: 700; padding: 6px 20px; border-radius: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .icon-card.style-border-box { border-style: solid; border-width: 14px; padding: 25px; }
        .icon-card.style-border-box .badge-header { background: none !important; color: #1A1A1A; font-family: 'Fredoka', sans-serif; font-size: 22pt; font-weight: 700; text-transform: uppercase; text-align: center; padding: 0; }

        /* Contenu Dossiers 500x500 */
        .card-inner-content { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; flex-grow: 1; width: 100%; gap: 10px; }
        .icon-image-container { display: flex; justify-content: center; align-items: center; height: 100px; }
        .icon-image-container img { max-height: 100%; max-width: 140px; object-fit: contain; }
        .icon-image-container .emoji-display { font-size: 60pt; line-height: 1; }
        .title-main { font-family: 'Fredoka', sans-serif; font-size: 45pt; font-weight: 700; color: #1A1A1A; text-transform: uppercase; line-height: 1.0; word-break: break-word; }
        .title-sub { font-family: 'Fredoka', sans-serif; font-size: 28pt; color: var(--rouge); font-weight: 600; }
        .footer-brand { display: flex; align-items: center; gap: 10px; border-top: 3px solid #E8E8E8; padding-top: 15px; width: 100%; justify-content: center; }
        .brand-text { font-family: 'Fredoka', sans-serif; font-size: 18pt; font-weight: 700; color: #3D3D3D; text-transform: uppercase; letter-spacing: 1px; }
        .brand-text span { color: var(--rouge); }

        /* ========================================================= */
        /* --- MODULE KALISPORT : TEXTE ULTRA XL 128x128 PX --- */
        /* ========================================================= */
        .kalisport-card {
            width: 128px;
            height: 128px;
            border-radius: 50%;
            background: #FFFFFF;
            border: 6px solid var(--rouge);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 4px;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
            transition: all 0.2s ease;
            text-align: center;
        }

        /* Thème Plein Couleur */
        .kalisport-card.theme-filled {
            background-color: var(--rouge);
            border-color: var(--rouge);
        }
        .kalisport-card.theme-filled .title-main-ks {
            color: #FFFFFF !important;
        }

        /* Variations de bordures */
        .kalisport-card.border-thick { border-width: 7px; }
        .kalisport-card.border-thin { border-width: 3px; }
        .kalisport-card.border-none { border: none; }

        .card-inner-content-ks {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .title-main-ks {
            font-family: 'Fredoka', sans-serif;
            font-size: 24pt;
            font-weight: 800;
            color: #1A1A1A;
            text-transform: uppercase;
            line-height: 0.88;
            word-break: break-word;
            width: 100%;
            padding: 0 4px;
            letter-spacing: -0.5px;
        }

        .title-sub-ks {
            font-family: 'Fredoka', sans-serif;
            font-size: 9.5pt;
            color: #FFFFFF;
            background-color: var(--rouge);
            font-weight: 700;
            line-height: 1.0;
            margin-top: 4px;
            padding: 2px 8px;
            border-radius: 10px;
            text-transform: uppercase;
            max-width: 90%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .download-btn {
            border: none;
            font-family: 'Fredoka', sans-serif;
            font-size: 16pt;
            padding: 14px 32px;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(196, 30, 58, 0.4);
            transition: transform 0.1s, background-color 0.2s;
            color: #FFF;
            background-color: var(--rouge);
        }

        .download-btn:hover {
            background-color: var(--rouge-hover);
            transform: scale(1.05);
        }

        .btn-reset {
            background-color: #555;
            color: #FFF;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 9pt;
        }

        @media print {
            body { background: white; padding: 0; color: black; display: block !important; }
            .no-print, .sidebar, .topbar, .tab-bar { display: none !important; }
            .main-content { padding: 0 !important; overflow: visible !important; }
            .tab-content { display: block !important; margin: 0 !important; padding: 0 !important; }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR DYNAMIQUE -->
    <div class="sidebar"></div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <div class="topbar no-print">
            <div class="page-title-area">
                <h2>Studio Créateur d'Icônes — <span>Dojo Dornois</span></h2>
                <p>Générateur de vignettes haute définition et d'icônes d'événements Kalisport</p>
            </div>
            <a href="../index.html" class="btn btn-dark">🏠 Central</a>
        </div>

        <!-- ONGLETS DE NAVIGATION -->
        <div class="tab-bar no-print">
            <button class="tab-btn active" onclick="switchTab('tab-dossiers')">📁 Icônes Dossiers (500x500)</button>
            <button class="tab-btn" onclick="switchTab('tab-kalisport')">🏆 Événements Kalisport (128x128 TEXTE ULTRA)</button>
        </div>

        <!-- ========================================================= -->
        <!-- ONGLET 1 : ICÔNES DOSSIERS (500x500) -->
        <!-- ========================================================= -->
        <div class="tab-content active" id="tab-dossiers">
            <div class="studio-container">
                
                <div class="config-panel no-print">

                    <div class="config-group">
                        <label>Structure / Modèle d'icône :</label>
                        <select id="selectStyle" onchange="updatePreview()">
                            <option value="style-root">1. Dossier Racine</option>
                            <option value="style-tab" selected>2. Intercalaire</option>
                            <option value="style-header-wave">3. Chemise</option>
                            <option value="style-ribbon">4. Étiquette</option>
                            <option value="style-left-pill">5. Pastille Gauche</option>
                            <option value="style-border-box">6. Archive</option>
                        </select>
                    </div>
                    
                    <div class="config-group">
                        <label>1. Badge / Code / En-tête :</label>
                        <input type="text" id="inputBadge" value="00 - COMPTA" oninput="updatePreview()">
                    </div>

                    <div class="config-group">
                        <label>Couleur Thème (40 Thèmes Prédéfinis) :</label>
                        <input type="color" id="inputBadgeColor" value="#C41E3A" onchange="updatePreview()">
                        
                        <div class="color-presets-grid" id="presetGrid1"></div>
                    </div>

                    <div class="config-group">
                        <div class="row-flex" style="justify-content: space-between;">
                            <label>2. Visuel (Image / Emoji) :</label>
                            <button class="btn-reset" onclick="clearImage('dossier')">Masquer Visuel</button>
                        </div>
                        <input type="file" id="inputImage" accept="image/*" onchange="handleImageUpload(event, 'dossier')">
                        <div class="emoji-bar" id="emojiBar1"></div>
                    </div>

                    <div class="config-group">
                        <label>3. Texte Principal :</label>
                        <input type="text" id="inputMainTitle" value="COMPTABILITÉ" oninput="updatePreview()">
                    </div>

                    <div class="config-group">
                        <div class="row-flex">
                            <label>Taille du Texte :</label>
                            <input type="range" id="inputFontSize" min="20" max="75" value="45" oninput="updatePreview()" style="flex:1;">
                        </div>
                    </div>

                    <div class="config-group">
                        <label>Couleur du Texte Principal :</label>
                        <input type="color" id="inputMainColor" value="#1A1A1A" onchange="updatePreview()">
                    </div>

                    <div class="config-group">
                        <label>4. Sous-titre / Année :</label>
                        <input type="text" id="inputSubTitle" value="2026 - 2027" oninput="updatePreview()">
                    </div>

                    <div class="config-group">
                        <label>Couleur du Sous-titre :</label>
                        <input type="color" id="inputSubColor" value="#C41E3A" onchange="updatePreview()">
                    </div>
                </div>

                <div class="preview-area">
                    <div class="icon-card style-tab" id="previewCard">
                        <div class="badge-header" id="cardBadge">00 - COMPTA</div>
                        
                        <div class="card-inner-content">
                            <div class="icon-image-container" id="cardImageContainer">
                                <span class="emoji-display">📊</span>
                            </div>
                            <div class="title-main" id="cardMainTitle">COMPTABILITÉ</div>
                            <div class="title-sub" id="cardSubTitle">2026 - 2027</div>
                        </div>

                        <div class="footer-brand">
                            <div class="brand-text">Dojo <span>Dornois</span></div>
                        </div>
                    </div>

                    <button class="download-btn no-print" onclick="downloadPNG('previewCard', 'inputBadge', 'icone_dossier')">📥 Télécharger PNG Transparent (500x500)</button>
                </div>

            </div>
        </div>

        <!-- ========================================================= -->
        <!-- ONGLET 2 : MODULE KALISPORT TEXTE ULTRA XL (128x128) -->
        <!-- ========================================================= -->
        <div class="tab-content" id="tab-kalisport">
            <div class="studio-container">
                
                <div class="config-panel no-print">

                    <div class="config-group">
                        <label>Style de Fond :</label>
                        <select id="selectThemeKs" onchange="updatePreviewKs()">
                            <option value="theme-white" selected>Fond Blanc + Contour Couleur</option>
                            <option value="theme-filled">Fond Couleur + Texte Blanc</option>
                        </select>
                    </div>

                    <div class="config-group">
                        <label>Épaisseur de Bordure :</label>
                        <select id="selectBorderKs" onchange="updatePreviewKs()">
                            <option value="border-thick" selected>Bordure Épaisse (7px)</option>
                            <option value="border-normal">Bordure Normale (5px)</option>
                            <option value="border-thin">Bordure Fine (3px)</option>
                            <option value="border-none">Sans Bordure</option>
                        </select>
                    </div>

                    <div class="config-group">
                        <label>Couleur Thème (Bordure & Badge) :</label>
                        <input type="color" id="inputBorderColorKs" value="#C41E3A" onchange="updatePreviewKs()">
                        
                        <div class="color-presets-grid" id="presetGrid2"></div>
                    </div>

                    <div class="config-group">
                        <label>1. Titre Principal (Grand & Lisible) :</label>
                        <input type="text" id="inputMainTitleKs" value="STAGE" oninput="updatePreviewKs()">
                    </div>

                    <div class="config-group">
                        <div class="row-flex">
                            <label>Taille du Titre :</label>
                            <input type="range" id="inputFontSizeKs" min="14" max="36" value="24" oninput="updatePreviewKs()" style="flex:1;">
                        </div>
                    </div>

                    <div class="config-group">
                        <label>Couleur du Titre :</label>
                        <input type="color" id="inputMainColorKs" value="#1A1A1A" onchange="updatePreviewKs()">
                    </div>

                    <div class="config-group">
                        <label>2. Sous-titre / Tag (Ex: Multi-Activités) :</label>
                        <input type="text" id="inputSubTitleKs" value="Multi-Activités" oninput="updatePreviewKs()">
                    </div>
                </div>

                <div class="preview-area">
                    <!-- ICON CARD RONDE TEXTE ULTRA KALISPORT 128x128 -->
                    <div class="kalisport-card border-thick" id="previewCardKs">
                        <div class="card-inner-content-ks">
                            <div class="title-main-ks" id="cardMainTitleKs">STAGE</div>
                            <div class="title-sub-ks" id="cardSubTitleKs">Multi-Activités</div>
                        </div>
                    </div>

                    <button class="download-btn no-print" onclick="downloadPNG('previewCardKs', 'inputMainTitleKs', 'icone_kalisport_128x128')">📥 Télécharger PNG Transparent (128x128)</button>
                </div>

            </div>
        </div>

    </div>

    <script>
        // Data commune
        const presetColors = [
            '#C41E3A','#E11D48','#F43F5E','#DB2777','#EC4899','#A855F7','#9333EA','#6B21A8',
            '#3B82F6','#2563EB','#1D4ED8','#0284C7','#06B6D4','#0891B2','#0D9488','#14B8A6',
            '#10B981','#059669','#16A34A','#22C55E','#65A30D','#84CC16','#A3E635','#4D7C0F',
            '#FACC15','#EAB308','#CA8A04','#F97316','#D97706','#EA580C','#C2410C','#78350F',
            '#A16207','#78716C','#57534E','#6B7280','#4B5563','#1F2937','#0F172A','#18181B'
        ];

        const presetEmojis = ['🥋', '📊', '📁', '🪙', '📜', '🏆', '📷', '✉️', '📅', '💡'];

        // Etats Dossiers
        let currentImageSrcDossier = null;
        let currentEmojiDossier = '📊';

        // Initialisation des grilles
        function initControls() {
            ['presetGrid1', 'presetGrid2'].forEach((gridId, idx) => {
                const grid = document.getElementById(gridId);
                const isKs = idx === 1;
                presetColors.forEach(color => {
                    const btn = document.createElement('div');
                    btn.className = 'color-btn';
                    btn.style.backgroundColor = color;
                    btn.onclick = () => setPresetColor(color, isKs ? 'kalisport' : 'dossier');
                    grid.appendChild(btn);
                });
            });

            const bar = document.getElementById('emojiBar1');
            presetEmojis.forEach(emoji => {
                const btn = document.createElement('button');
                btn.className = 'emoji-btn';
                btn.innerText = emoji;
                btn.onclick = () => setEmoji(emoji, 'dossier');
                bar.appendChild(btn);
            });
        }

        // Switch d'onglets
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            if(tabId === 'tab-dossiers') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-dossiers').classList.add('active');
                updatePreview();
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-kalisport').classList.add('active');
                updatePreviewKs();
            }
        }

        function handleImageUpload(event, module) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentImageSrcDossier = e.target.result;
                    currentEmojiDossier = null;
                    updatePreview();
                };
                reader.readAsDataURL(file);
            }
        }

        function setEmoji(emoji, module) {
            currentEmojiDossier = emoji;
            currentImageSrcDossier = null;
            document.getElementById('inputImage').value = '';
            updatePreview();
        }

        function clearImage(module) {
            currentImageSrcDossier = null;
            currentEmojiDossier = null;
            document.getElementById('inputImage').value = '';
            updatePreview();
        }

        function setPresetColor(colorHex, module) {
            if (module === 'dossier') {
                document.getElementById('inputBadgeColor').value = colorHex;
                document.getElementById('inputSubColor').value = colorHex;
                updatePreview();
            } else {
                document.getElementById('inputBorderColorKs').value = colorHex;
                updatePreviewKs();
            }
        }

        // MAJ DOSSIER 500x500
        function updatePreview() {
            const styleChoice = document.getElementById('selectStyle').value;
            const badgeText = document.getElementById('inputBadge').value;
            const badgeColor = document.getElementById('inputBadgeColor').value;
            const mainText = document.getElementById('inputMainTitle').value;
            const fontSize = document.getElementById('inputFontSize').value;
            const mainColor = document.getElementById('inputMainColor').value;
            const subText = document.getElementById('inputSubTitle').value;
            const subColor = document.getElementById('inputSubColor').value;

            const card = document.getElementById('previewCard');
            card.className = 'icon-card ' + styleChoice;

            const badgeElem = document.getElementById('cardBadge');
            badgeElem.innerText = badgeText || 'CATEGORIE';

            let styleSheet = document.getElementById('dynamic-style');
            if (!styleSheet) {
                styleSheet = document.createElement('style');
                styleSheet.id = 'dynamic-style';
                document.head.appendChild(styleSheet);
            }

            if (styleChoice === 'style-root') {
                badgeElem.style.backgroundColor = badgeColor;
                badgeElem.style.color = '#FFFFFF';
            } else if (styleChoice === 'style-tab') {
                styleSheet.innerHTML = `.style-tab::before { background-color: ${badgeColor} !important; }`;
                badgeElem.style.color = badgeColor;
                badgeElem.style.backgroundColor = 'transparent';
            } else if (styleChoice === 'style-ribbon' || styleChoice === 'style-header-wave' || styleChoice === 'style-left-pill') {
                badgeElem.style.backgroundColor = badgeColor;
                badgeElem.style.color = '#FFFFFF';
            } else if (styleChoice === 'style-border-box') {
                card.style.borderColor = badgeColor;
                badgeElem.style.color = '#1A1A1A';
            }

            const imgContainer = document.getElementById('cardImageContainer');
            if (currentImageSrcDossier) {
                imgContainer.style.display = 'flex';
                imgContainer.innerHTML = `<img src="${currentImageSrcDossier}" alt="icone">`;
            } else if (currentEmojiDossier) {
                imgContainer.style.display = 'flex';
                imgContainer.innerHTML = `<span class="emoji-display">${currentEmojiDossier}</span>`;
            } else {
                imgContainer.style.display = 'none';
            }

            const mainElem = document.getElementById('cardMainTitle');
            mainElem.innerText = mainText;
            mainElem.style.fontSize = fontSize + 'pt';
            mainElem.style.color = mainColor;

            const subElem = document.getElementById('cardSubTitle');
            subElem.innerText = subText;
            subElem.style.color = subColor;
            subElem.style.display = subText.trim() ? 'block' : 'none';
        }

        // MAJ KALISPORT 128x128 TEXTE ULTRA
        function updatePreviewKs() {
            const themeStyle = document.getElementById('selectThemeKs').value;
            const borderStyle = document.getElementById('selectBorderKs').value;
            const themeColor = document.getElementById('inputBorderColorKs').value;
            const mainText = document.getElementById('inputMainTitleKs').value;
            const fontSize = document.getElementById('inputFontSizeKs').value;
            const mainColor = document.getElementById('inputMainColorKs').value;
            const subText = document.getElementById('inputSubTitleKs').value;

            const card = document.getElementById('previewCardKs');
            card.className = 'kalisport-card ' + borderStyle + ' ' + themeStyle;

            if (themeStyle === 'theme-filled') {
                card.style.backgroundColor = themeColor;
                card.style.borderColor = themeColor;
            } else {
                card.style.backgroundColor = '#FFFFFF';
                card.style.borderColor = themeColor;
            }

            const mainElem = document.getElementById('cardMainTitleKs');
            mainElem.innerText = mainText;
            mainElem.style.fontSize = fontSize + 'pt';
            if (themeStyle !== 'theme-filled') {
                mainElem.style.color = mainColor;
            }

            const subElem = document.getElementById('cardSubTitleKs');
            subElem.innerText = subText;
            subElem.style.backgroundColor = themeStyle === 'theme-filled' ? '#1A1A1A' : themeColor;
            subElem.style.display = subText.trim() ? 'inline-block' : 'none';
        }

        // Téléchargement PNG Transparent
        function downloadPNG(elementId, inputNameId, defaultName) {
            const element = document.getElementById(elementId);
            const rawName = document.getElementById(inputNameId).value || defaultName;
            const name = rawName.replace(/[^a-zA-Z0-9-_]/g, '_');
            
            html2canvas(element, {
                scale: 2,
                useCORS: true,
                backgroundColor: null
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = name + '.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        window.onload = function() {
            initControls();
            updatePreview();
            updatePreviewKs();
        };
    </script>

    <!-- SCRIPT DE LA SIDEBAR UNIFIÉE -->
    <script src="../js/sidebar.js"></script>
