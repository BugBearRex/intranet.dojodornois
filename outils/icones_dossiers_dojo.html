<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Générateur d'Icônes - Dojo Dornois</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght=600;700&family=Roboto:wght=500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --rouge: #C41E3A;
            --rouge-hover: #A3182E;
            --noir-doux: #1A1A1A;
            --gris-fonce: #3D3D3D;
            --gris-moyen: #6B6B6B;
            --gris-clair: #B8B8B8;
            --gris-tres-clair: #E8E8E8;
            --fond: #3D3D3D;
            --blanc: #FFFFFF;
            --sidebar-width: 280px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--fond);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- FIX SIDEBAR DÉBORDEMENT --- */
        .sidebar { 
            width: var(--sidebar-width); 
            min-width: var(--sidebar-width);
            max-width: var(--sidebar-width);
            background: var(--noir-doux); 
            color: var(--blanc); 
            display: flex; 
            flex-direction: column; 
            height: 100%; 
            position: relative; 
            box-shadow: 4px 0 15px rgba(0,0,0,0.1); 
            flex-shrink: 0; 
            box-sizing: border-box;
            overflow-x: hidden;
            z-index: 100;
        }

        .sidebar * {
            max-width: 100%;
            box-sizing: border-box;
        }

        .nav-link { display: flex; align-items: center; justify-content: flex-start !important; gap: 10px; padding: 9px 12px; color: var(--gris-clair); text-decoration: none; border-radius: 6px; font-weight: 500; font-size: 0.85rem; margin-bottom: 3px; }
        .nav-link:hover { background: rgba(255,255,255,0.08); color: var(--blanc); }
        .nav-link.active { background: var(--rouge); color: var(--blanc); font-weight: bold; }

        /* MAIN CONTENT SCROLLABLE */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        /* PANNEAU DE CONTRÔLE DYNAMIQUE */
        .control-panel {
            background-color: #FFFFFF;
            border-radius: 20px;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 3px solid #C41E3A;
            flex-shrink: 0;
        }

        .control-panel label {
            font-family: 'Fredoka', sans-serif;
            font-size: 14pt;
            color: #1A1A1A;
        }

        .control-panel input {
            font-family: 'Fredoka', sans-serif;
            font-size: 14pt;
            padding: 8px 12px;
            width: 100px;
            border: 2px solid #E8E8E8;
            border-radius: 10px;
            text-align: center;
        }

        .btn-generate {
            background-color: #1A1A1A;
            color: #FFFFFF;
            border: none;
            font-family: 'Fredoka', sans-serif;
            font-size: 14pt;
            padding: 10px 24px;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-generate:hover {
            background-color: #C41E3A;
        }

        /* GRILLE DE CARTES */
        .cards-container {
            display: flex;
            flex-wrap: wrap;
            gap: 35px;
            justify-content: center;
            width: 100%;
        }

        .card-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        /* CARRE STRICT 500x500 PX */
        .icon-card {
            width: 500px;
            height: 500px;
            background-color: #F5F5F5;
            border-radius: 60px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 30px;
            position: relative;
            overflow: hidden;
        }

        .icon-card.season-card {
            background: linear-gradient(145deg, #FFFFFF 0%, #F5F5F5 100%);
        }

        .badge-header {
            background-color: #C41E3A;
            color: #FFFFFF;
            font-family: 'Fredoka', sans-serif;
            font-size: 22pt;
            font-weight: 700;
            text-transform: uppercase;
            padding: 10px 30px;
            border-radius: 50px;
            letter-spacing: 1px;
            box-shadow: 0 6px 15px rgba(196, 30, 58, 0.3);
        }

        .main-card-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            flex-grow: 1;
        }

        .title-season {
            font-family: 'Fredoka', sans-serif;
            font-size: 52pt;
            font-weight: 700;
            color: #1A1A1A;
            line-height: 1.1;
        }

        .title-season span {
            color: #C41E3A;
            display: block;
        }

        .title-month {
            font-family: 'Fredoka', sans-serif;
            font-size: 64pt;
            font-weight: 700;
            color: #1A1A1A;
            text-transform: uppercase;
            line-height: 1.0;
        }

        .year-sub {
            font-family: 'Fredoka', sans-serif;
            font-size: 32pt;
            color: #C41E3A;
            font-weight: 600;
            margin-top: 10px;
        }

        .footer-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            border-top: 3px solid #E8E8E8;
            padding-top: 15px;
            width: 100%;
            justify-content: center;
        }

        .brand-text {
            font-family: 'Fredoka', sans-serif;
            font-size: 18pt;
            font-weight: 700;
            color: #3D3D3D;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .brand-text span {
            color: #C41E3A;
        }

        .download-btn {
            background-color: #C41E3A;
            color: #FFFFFF;
            border: none;
            font-family: 'Fredoka', sans-serif;
            font-size: 14pt;
            padding: 10px 24px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.1s ease, background-color 0.2s;
        }

        .download-btn:hover {
            background-color: #a3182e;
            transform: scale(1.05);
        }

        @media print {
            body { background: white; padding: 0; color: black; display: block !important; }
            .no-print, .sidebar, .control-panel, .download-btn { display: none !important; }
            .main-content { padding: 0 !important; overflow: visible !important; }
        }
    </style>
</head>
<body>

    <!-- CONTENEUR SIDEBAR DYNAMIQUE -->
    <div class="sidebar"></div>

    <div class="main-content">
        <!-- BARRE DE COMMANDE -->
        <div class="control-panel no-print">
            <label for="startYear">Année Début :</label>
            <input type="number" id="startYear" value="2026">
            
            <label for="endYear">Année Fin :</label>
            <input type="number" id="endYear" value="2027">

            <button class="btn-generate" onclick="generateCards()">⚡ Générer la Saison</button>
        </div>

        <!-- CONTENEUR DES CARTES -->
        <div class="cards-container" id="cardsContainer"></div>
    </div>

    <script>
        const monthsData = [
            { num: '01', name: 'Septembre', code: 'SEP', yearOffset: 0 },
            { num: '02', name: 'Octobre', code: 'OCT', yearOffset: 0 },
            { num: '03', name: 'Novembre', code: 'NOV', yearOffset: 0 },
            { num: '04', name: 'Décembre', code: 'DÉC', yearOffset: 0 },
            { num: '05', name: 'Janvier', code: 'JAN', yearOffset: 1 },
            { num: '06', name: 'Février', code: 'FÉV', yearOffset: 1 },
            { num: '07', name: 'Mars', code: 'MARS', yearOffset: 1 },
            { num: '08', name: 'Avril', code: 'AVR', yearOffset: 1 },
            { num: '09', name: 'Mai', code: 'MAI', yearOffset: 1 },
            { num: '10', name: 'Juin', code: 'JUIN', yearOffset: 1 },
            { num: '11', name: 'Juillet', code: 'JUIL', yearOffset: 1 },
            { num: '12', name: 'Août', code: 'AOÛT', yearOffset: 1 }
        ];

        function generateCards() {
            const yStart = parseInt(document.getElementById('startYear').value);
            const yEnd = parseInt(document.getElementById('endYear').value);
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            // 1. Carte de la Saison Globale
            const seasonCardId = `season-${yStart}-${yEnd}`;
            const seasonHTML = `
                <div class="card-wrapper">
                    <div class="icon-card season-card" id="${seasonCardId}">
                        <div class="badge-header">Saison</div>
                        <div class="main-card-content">
                            <div class="title-season">${yStart}<span>${yEnd}</span></div>
                        </div>
                        <div class="footer-brand">
                            <div class="brand-text">Dojo <span>Dornois</span></div>
                        </div>
                    </div>
                    <button class="download-btn no-print" onclick="downloadPNG('${seasonCardId}', 'Saison-${yStart}-${yEnd}.png')">📥 Télécharger PNG</button>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', seasonHTML);

            // 2. Cartes des 12 Mois
            monthsData.forEach(m => {
                const currentYear = m.yearOffset === 0 ? yStart : yEnd;
                const cardId = `card-${m.num}-${yStart}-${yEnd}`;
                const filename = `${m.num}-${m.name}-${currentYear}.png`;

                const monthHTML = `
                    <div class="card-wrapper">
                        <div class="icon-card" id="${cardId}">
                            <div class="badge-header">${m.num} - ${m.name}</div>
                            <div class="main-card-content">
                                <div class="title-month">${m.code}</div>
                                <div class="year-sub">${currentYear}</div>
                            </div>
                            <div class="footer-brand">
                                <div class="brand-text">Dojo <span>Dornois</span></div>
                            </div>
                        </div>
                        <button class="download-btn no-print" onclick="downloadPNG('${cardId}', '${filename}')">📥 Télécharger PNG</button>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', monthHTML);
            });
        }

        function downloadPNG(cardId, filename) {
            const cardElement = document.getElementById(cardId);
            html2canvas(cardElement, {
                scale: 2,
                useCORS: true,
                backgroundColor: null
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = filename;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        // Génération automatique au chargement
        window.onload = generateCards;
    </script>

    <!-- SCRIPT DE LA SIDEBAR UNIFIÉE -->
    <script src="../js/sidebar.js"></script>

</body>
</html>
