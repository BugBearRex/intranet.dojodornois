<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur d'Icônes Articles SumUp - Dojo Dornois</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Roboto:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --rouge: #C41E3A;
            --noir-doux: #1A1A1A;
            --gris-fonce: #3D3D3D;
            --gris-moyen: #6B6B6B;
            --gris-tres-clair: #E8E8E8;
            --fond: #F4F6F9;
            --blanc: #FFFFFF;
            --sidebar-width: 280px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--fond);
            color: var(--gris-fonce);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar { 
            width: var(--sidebar-width); 
            min-width: var(--sidebar-width);
            background: var(--noir-doux); 
            color: var(--blanc); 
            height: 100%; 
            flex-shrink: 0; 
            z-index: 100;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .topbar {
            background: var(--blanc);
            height: 68px;
            padding: 0 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--gris-tres-clair);
            flex-shrink: 0;
        }

        .topbar h2 {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.3rem;
            color: var(--noir-doux);
        }
        .topbar h2 span { color: var(--rouge); }

        .content-scrollable {
            flex: 1;
            overflow-y: auto;
            padding: 24px 30px;
            display: flex;
            gap: 40px;
            align-items: flex-start;
            justify-content: center;
        }

        .panel-form {
            width: 440px;
            background: var(--blanc);
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            border: 1px solid var(--gris-tres-clair);
            display: flex;
            flex-direction: column;
            gap: 14px;
            flex-shrink: 0;
        }

        .section-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 0.95rem;
            color: var(--rouge);
            border-bottom: 2px solid var(--gris-tres-clair);
            padding-bottom: 4px;
        }

        .cat-badges-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .cat-btn {
            border: 1px solid var(--gris-tres-clair);
            background: #FAFAFA;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.15s ease;
        }

        .cat-btn.active {
            border-color: currentColor;
            background: #FFFFFF;
            box-shadow: 0 3px 8px rgba(0,0,0,0.12);
        }

        .cat-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--gris-moyen);
        }

        .form-control {
            width: 100%;
            padding: 8px 12px;
            border: 1.5px solid var(--gris-tres-clair);
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        /* ZONE D'APERÇU */
        .preview-pane {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            position: sticky;
            top: 10px;
        }

        /* SIMULATION ÉCRAN SUMUP (POUR VOIR LE RENDU RÉEL RÉDUIT) */
        .sumup-simulation-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .sumup-card-canvas {
            width: 320px;
            height: 320px;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            background: #C41E3A;
            transition: background 0.2s;
        }

        /* MOTIF DE FOND GÉOMÉTRIQUE POUR DONNER DU RELIEF */
        .bg-pattern {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 30%, rgba(255,255,255,0.2) 0%, rgba(0,0,0,0.15) 100%);
            z-index: 1;
        }

        .big-symbol {
            position: relative;
            z-index: 2;
            font-size: 135px;
            line-height: 1;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.25));
        }

        .big-symbol img {
            width: 170px;
            height: 170px;
            object-fit: contain;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.25));
        }

        .short-label {
            position: relative;
            z-index: 2;
            font-family: 'Fredoka', sans-serif;
            font-size: 2rem;
            color: #FFFFFF;
            text-transform: uppercase;
            font-weight: 800;
            text-shadow: 0 3px 8px rgba(0,0,0,0.35);
            margin-top: 10px;
            letter-spacing: 1px;
            text-align: center;
            max-width: 90%;
        }

        /* REPRODUCTION DU VOILE NATIF SUMUP POUR TESTER LA LISIBILITÉ */
        .sumup-overlay-mockup {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.05) 50%, rgba(0,0,0,0.6) 100%);
            z-index: 3;
            pointer-events: none;
            display: none;
        }

        .mockup-text-top {
            position: absolute;
            top: 12px;
            left: 14px;
            right: 14px;
            color: #FFF;
            font-weight: 700;
            font-size: 0.9rem;
            line-height: 1.2;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .mockup-price-bottom {
            position: absolute;
            bottom: 12px;
            left: 14px;
            color: #FFF;
            font-weight: 700;
            font-size: 1.1rem;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .btn-download {
            background-color: var(--rouge);
            color: var(--blanc);
            border: none;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.05rem;
            padding: 12px 28px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(196, 30, 58, 0.35);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-download:hover {
            background-color: #A3182E;
            transform: scale(1.03);
        }
    </style>
</head>
<body>

    <div class="sidebar"></div>

    <div class="main-content">
        <div class="topbar">
            <h2>Générateur d'Icônes Simples <span>SumUp</span></h2>
            <div style="font-size:0.85rem; font-weight:600; color:var(--gris-moyen);">Optimisé pour l'écran caisse SumUp Terminal</div>
        </div>

        <div class="content-scrollable">
            
            <div class="panel-form">
                <div class="section-title">🗂️ 1. Catégorie & Couleur SumUp</div>
                <div class="cat-badges-grid">
                    <button class="cat-btn active" onclick="setCategory('#C41E3A', '🥋', '')">
                        <span class="cat-indicator" style="background:#C41E3A;"></span> 🥋 Cotisations
                    </button>
                    <button class="cat-btn" onclick="setCategory('#F39C12', '🏆', '')">
                        <span class="cat-indicator" style="background:#F39C12;"></span> 🏆 Stages
                    </button>
                    <button class="cat-btn" onclick="setCategory('#9B59B6', '🎟️', '')">
                        <span class="cat-indicator" style="background:#9B59B6;"></span> 🎈 Événements
                    </button>
                    <button class="cat-btn" onclick="setCategory('#2980B9', '🥋', '')">
                        <span class="cat-indicator" style="background:#2980B9;"></span> 🛍️ Boutique
                    </button>
                    <button class="cat-btn" onclick="setCategory('#2ECC71', '🥤', '')">
                        <span class="cat-indicator" style="background:#2ECC71;"></span> 🥤 Buvette
                    </button>
                    <button class="cat-btn" onclick="setCategory('#1ABC9C', '🧘', '')">
                        <span class="cat-indicator" style="background:#1ABC9C;"></span> 🧘 Sophro
                    </button>
                </div>

                <div class="section-title">🖼️ 2. Symbole ou Photo Centrale</div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Émoji XXL :</label>
                        <input type="text" id="emojiInput" class="form-control" value="🥋" oninput="setEmoji(this.value)">
                    </div>
                    <div class="form-group">
                        <label>Ou Charger Image :</label>
                        <input type="file" id="fileInput" class="form-control" accept="image/*" onchange="handleImage(event)">
                    </div>
                </div>

                <div class="section-title">✏️ 3. Mot-Clé Optionnel (Court)</div>
                <div class="form-group">
                    <label>Texte sous l'icône (laisser vide si inutile) :</label>
                    <input type="text" id="shortLabelInput" class="form-control" placeholder="Ex: 6 ANS +, SODA, REPAS..." oninput="updateView()">
                </div>

                <div class="form-group">
                    <label>Couleur personnalisée du fond :</label>
                    <input type="color" id="bgColor" class="form-control" value="#C41E3A" style="padding:2px; height:38px; cursor:pointer;" onchange="updateView()">
                </div>

                <div style="background:#F8FAFC; border:1px solid var(--gris-tres-clair); padding:10px; border-radius:8px; margin-top:8px;">
                    <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:0.85rem; font-weight:600;">
                        <input type="checkbox" id="toggleOverlay" onchange="toggleMockup(this.checked)">
                        👁️ Simuler le texte de l'écran SumUp
                    </label>
                </div>
            </div>

            <!-- APERÇU -->
            <div class="preview-pane">
                <div class="sumup-simulation-box">
                    <div class="sumup-card-canvas" id="sumupCard">
                        <div class="bg-pattern"></div>
                        
                        <div class="big-symbol" id="symbolBox">🥋</div>
                        <div class="short-label" id="labelBox" style="display:none;"></div>

                        <!-- SIMULATEUR DU TEXTE SUMUP TERMINAL -->
                        <div class="sumup-overlay-mockup" id="mockupLayer">
                            <div class="mockup-text-top">Cotisation Annuelle | 6 ans et +</div>
                            <div class="mockup-price-bottom">166,00 €</div>
                        </div>
                    </div>
                    <span style="font-size:0.8rem; color:var(--gris-moyen);">Aperçu fidèle au boîtier SumUp</span>
                </div>

                <button class="btn-download" onclick="downloadIcon()">
                    📥 Télécharger l'icône (PNG net 500x500)
                </button>
            </div>

        </div>
    </div>

    <script src="../js/sidebar.js"></script>

    <script>
        function setCategory(color, emoji, shortText) {
            document.getElementById('bgColor').value = color;
            document.getElementById('emojiInput').value = emoji;
            document.getElementById('shortLabelInput').value = shortText;
            setEmoji(emoji);

            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            updateView();
        }

        function setEmoji(val) {
            const box = document.getElementById('symbolBox');
            box.innerHTML = val || '🥋';
            updateView();
        }

        function handleImage(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    document.getElementById('symbolBox').innerHTML = `<img src="${evt.target.result}" alt="Item">`;
                    updateView();
                }
                reader.readAsDataURL(file);
            }
        }

        function updateView() {
            const color = document.getElementById('bgColor').value;
            const text = document.getElementById('shortLabelInput').value.trim();
            const labelBox = document.getElementById('labelBox');
            const card = document.getElementById('sumupCard');

            card.style.backgroundColor = color;

            if (text) {
                labelBox.innerText = text;
                labelBox.style.display = 'block';
                document.getElementById('symbolBox').style.fontSize = '105px';
            } else {
                labelBox.style.display = 'none';
                document.getElementById('symbolBox').style.fontSize = '135px';
            }
        }

        function toggleMockup(show) {
            document.getElementById('mockupLayer').style.display = show ? 'block' : 'none';
        }

        function downloadIcon() {
            const card = document.getElementById('sumupCard');
            const mockup = document.getElementById('mockupLayer');
            
            // Masquer la simulation SumUp avant l'export
            const wasMockupVisible = mockup.style.display;
            mockup.style.display = 'none';

            html2canvas(card, {
                width: 320,
                height: 320,
                scale: 2, // Sortie HD 640x640 parfaitement nette
                backgroundColor: null
            }).then(canvas => {
                mockup.style.display = wasMockupVisible;
                const link = document.createElement('a');
                link.download = 'icone_sumup.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        window.onload = updateView;
    </script>
</body>
</html>
