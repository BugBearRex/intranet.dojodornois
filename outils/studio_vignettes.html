<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Créateur de Vignettes & Étiquettes — Dojo Dornois</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Roboto:ital,wght@0,400;0,500;0,700;1,400&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --rouge: #C41E3A;
            --rouge-hover: #A3182E;
            --rouge-clair: #FFEBEF;
            --noir-doux: #1A1A1A;
            --fond-sombre: #1E1E24;
            --blanc: #FFFFFF;
            --sidebar-width: 280px;
            --topbar-height: 64px;
        }

        *, *::before, *::after { box-sizing: border-box; }

        * {
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--fond-sombre);
            margin: 0; padding: 0;
            color: var(--blanc);
            display: flex;
            height: 100vh;
            overflow: hidden;
            font-size: 13px;
        }

        .sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            background: var(--noir-doux);
            color: var(--blanc);
            display: flex;
            flex-direction: column;
            height: 100%;
            flex-shrink: 0;
            z-index: 100;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            min-width: 0;
        }

        .topbar {
            height: var(--topbar-height);
            background: #151518;
            border-bottom: 2px solid #2B2B36;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            flex-shrink: 0;
        }
        .topbar-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.25rem;
            color: var(--rouge);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .tabs-nav {
            display: flex;
            gap: 8px;
        }
        .tab-btn {
            background: #252530;
            border: 1px solid #3A3A4A;
            color: #C2C2D0;
            padding: 9px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }
        .tab-btn:hover { background: #323242; color: #FFF; }
        .tab-btn.active {
            background: var(--rouge);
            border-color: var(--rouge);
            color: #FFF;
        }

        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .tab-content-view {
            display: none;
            width: 100%;
            height: 100%;
        }
        .tab-content-view.active {
            display: flex;
        }

        .control-panel {
            width: 450px;
            background: #18181F;
            border-right: 1px solid #2B2B36;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-shrink: 0;
        }
        .section-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 0.95rem;
            color: #E2E8F0;
            border-bottom: 1px solid #2B2B36;
            padding-bottom: 5px;
            margin: 6px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin-bottom: 5px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        label {
            font-size: 0.70rem;
            color: #94A3B8;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        input, select {
            background: #23232C;
            border: 1px solid #3A3A4A;
            border-radius: 6px;
            padding: 6px 8px;
            color: #FFF;
            font-family: inherit;
            font-size: 0.82rem;
            outline: none;
            width: 100%;
        }
        input:focus, select:focus {
            border-color: var(--rouge);
        }

        .model-card {
            background: #22222C;
            border: 1px solid #363646;
            border-left: 4px solid var(--rouge);
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .model-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .model-card-title {
            font-family: 'Fredoka', sans-serif;
            color: #FFF;
            font-size: 0.85rem;
        }

        .preset-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 2px;
        }
        .btn-preset-mini {
            background: #2D2D3A;
            border: 1px solid #45455A;
            color: #E2E8F0;
            padding: 3px 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.65rem;
        }
        .btn-preset-mini:hover {
            border-color: var(--rouge);
            background: #3B3B4C;
        }

        .btn-action {
            background: var(--rouge);
            color: #FFF;
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 600;
        }
        .btn-action:hover { background: var(--rouge-hover); }

        .btn-preset-load {
            background: #2563EB;
            color: #FFF;
            border: none;
            border-radius: 6px;
            padding: 8px 10px;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.80rem;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-preset-load:hover { background: #1D4ED8; }

        .btn-sm-add {
            background: #10B981;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 0.70rem;
            font-family: 'Fredoka', sans-serif;
            cursor: pointer;
        }
        .btn-sm-del {
            background: transparent;
            color: #EF4444;
            border: 1px solid #EF4444;
            border-radius: 4px;
            padding: 2px 5px;
            font-size: 0.65rem;
            cursor: pointer;
        }

        .alert-info-box {
            background: #2D271D;
            border-left: 3px solid #D97706;
            color: #FCD34D;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.72rem;
            line-height: 1.35;
        }

        .preview-area {
            flex: 1;
            background: #111116;
            padding: 20px;
            overflow: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 15px;
        }

        .a4-sheet {
            background: #FFFFFF;
            width: 210mm;
            height: 297mm;
            min-height: 297mm;
            max-height: 297mm;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: grid;
            box-sizing: border-box;
            color: #1A1A1A;
            overflow: hidden;
            margin: 0 auto;
        }

        /* GABARIT STRICT AVERY J8159 */
        .layout-avery-j8159 {
            padding-top: var(--calib-top, 13mm) !important;
            padding-bottom: 13mm !important;
            padding-left: var(--calib-left, 7.2mm) !important;
            padding-right: 7.2mm !important;
            grid-template-columns: 63.5mm 63.5mm 63.5mm !important;
            grid-template-rows: repeat(8, 33.9mm) !important;
            column-gap: 2.5mm !important;
            row-gap: 0mm !important;
            background: #FAFAFA;
        }

        .judo-label-card {
            width: 63.5mm !important;
            height: 33.9mm !important;
            max-width: 63.5mm !important;
            max-height: 33.9mm !important;
            background: #FFFFFF;
            border: 0.15mm solid #E2E8F0;
            border-radius: 1.5mm;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            position: relative;
        }

        .judo-label-card.empty-slot {
            background: transparent !important;
            border: 0.15mm dashed #CBD5E1 !important;
        }

        .label-header {
            height: 6.8mm;
            padding: 0 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #FFFFFF;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.58rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            flex-shrink: 0;
        }
        .label-header-left {
            display: flex;
            align-items: center;
            gap: 3px;
            font-weight: 700;
        }
        .label-header-badge {
            font-size: 0.50rem;
            padding: 1px 4px;
            border-radius: 3px;
            background: rgba(255,255,255,0.3);
            font-weight: 700;
        }

        .label-body {
            height: 27.1mm;
            padding: 2.5mm 4mm;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            flex: 1;
        }

        .label-main-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 0.2mm solid #F1F5F9;
            padding-bottom: 1.5px;
            line-height: 1;
        }
        .label-size-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            color: #1A1A1A;
            line-height: 1;
        }
        .label-type-pill {
            font-size: 0.48rem;
            font-weight: 700;
            padding: 1px 4px;
            border-radius: 6px;
            text-transform: uppercase;
            line-height: 1.1;
        }

        .label-details {
            font-size: 0.58rem;
            color: #475569;
            line-height: 1.18;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        .label-details b { color: #0F172A; }

        .label-footer-line {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 0.2mm dashed #E2E8F0;
            padding-top: 1.5px;
            font-size: 0.50rem;
            color: #94A3B8;
            font-family: 'Fredoka', sans-serif;
            line-height: 1;
        }

        /* THÈMES */
        .theme-complet .label-header { background: #C41E3A; }
        .theme-complet .label-type-pill { background: #FFEBEF; color: #C41E3A; }

        .theme-veste .label-header { background: #E67E22; }
        .theme-veste .label-type-pill { background: #FDF2E9; color: #D35400; }

        .theme-pantalon .label-header { background: #27AE60; }
        .theme-pantalon .label-type-pill { background: #E8F8F0; color: #1E8449; }

        .theme-inconnu .label-header { background: #8E44AD; }
        .theme-inconnu .label-type-pill { background: #F4ECF7; color: #712794; }

        .theme-ceintures .label-header { background: #34495E; }
        .theme-ceintures .label-type-pill { background: #EAECEE; color: #2C3E50; }

        .theme-compta .label-header { background: #1A1A1A; }
        .theme-compta .label-type-pill { background: #FFEBEF; color: #C41E3A; }

        /* IMPRESSION DIRECTE */
        @page {
            size: A4 portrait;
            margin: 0 !important;
        }
        @media print {
            html, body {
                width: 210mm !important;
                height: 297mm !important;
                margin: 0 !important;
                padding: 0 !important;
                background: #FFFFFF !important;
                color: #000000 !important;
                overflow: hidden !important;
            }
            .sidebar, .topbar, .control-panel, .no-print {
                display: none !important;
            }
            .main-content, .workspace, .tab-content-view, .preview-area {
                padding: 0 !important;
                margin: 0 !important;
                background: transparent !important;
                display: block !important;
                overflow: hidden !important;
                width: 210mm !important;
                height: 297mm !important;
            }
            .a4-sheet {
                width: 210mm !important;
                height: 297mm !important;
                box-shadow: none !important;
                page-break-inside: avoid !important;
                page-break-after: avoid !important;
                background: transparent !important;
            }
            .judo-label-card {
                border: 0.15mm solid #E2E8F0 !important;
            }
            .judo-label-card.empty-slot {
                border: none !important;
            }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR OFFICIELLE INTRANET -->
    <div class="sidebar"></div>

    <div class="main-content">
        <header class="topbar">
            <div class="topbar-title">
                <span style="background:var(--rouge); color:#FFF; padding:4px 8px; border-radius:6px; font-size:0.9rem;">DOJO</span>
                Studio Créateur & Étiquettes
            </div>
            <nav class="tabs-nav">
                <button class="tab-btn active">🏷️ Étiquettes Avery J8159</button>
            </nav>
        </header>

        <div class="workspace">
            <section id="tab-etiquettes" class="tab-content-view active">
                <div class="control-panel">
                    <div class="section-title">
                        <span>🎯 1. Calibrage & Marges Imprimante</span>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Ajustement Vertical Y (mm)</label>
                            <input type="number" id="calibTop" value="13.0" step="0.5" oninput="applyCalibration()" title="Augmenter si l'impression est trop haute">
                        </div>
                        <div class="form-group">
                            <label>Ajustement Horizontal X (mm)</label>
                            <input type="number" id="calibLeft" value="7.2" step="0.5" oninput="applyCalibration()" title="Augmenter si l'impression est trop à gauche">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Sauter X étiquettes</label>
                            <input type="number" id="lblSkip" value="0" min="0" max="23" oninput="renderFullSheet()">
                        </div>
                        <div class="form-group" style="justify-content: flex-end;">
                            <button class="btn-preset-load" onclick="loadSavedPdfModels()">📥 Recharger Planche PDF</button>
                        </div>
                    </div>

                    <div class="section-title">
                        <span>🥋 2. Liste des Modèles</span>
                        <button class="btn-sm-add" onclick="addNewModelCard()">+ Nouveau</button>
                    </div>

                    <div id="modelsContainer"></div>

                    <div style="display:flex; flex-direction:column; gap:10px; margin-top:10px;">
                        <button class="btn-action" onclick="window.print()">🖨️ Imprimer la Planche A4</button>
                    </div>

                    <div class="alert-info-box">
                        ⚠️ <b>Important lors de l'impression :</b>
                        <br>1. Choisis <b>Marges : Aucune</b> (ou Minimales).
                        <br>2. Échelle : <b>100%</b> (pas d'ajustement automatique).
                    </div>
                </div>

                <div class="preview-area">
                    <div style="color:#94A3B8; font-size:0.85rem;" class="no-print">
                        💡 <b>Gabarit Avery J8159 (63.5 × 33.9 mm)</b> — Alignement 3 colonnes × 8 lignes.
                    </div>
                    <div class="a4-sheet layout-avery-j8159" id="labelSheetContainer"></div>
                </div>
            </section>
        </div>
    </div>

    <script>
        let modelCount = 0;

        function applyCalibration() {
            const topVal = document.getElementById('calibTop').value || '13';
            const leftVal = document.getElementById('calibLeft').value || '7.2';
            document.documentElement.style.setProperty('--calib-top', topVal + 'mm');
            document.documentElement.style.setProperty('--calib-left', leftVal + 'mm');
        }

        function addNewModelCard(defaultData = null) {
            modelCount++;
            const id = 'model_' + modelCount;
            const container = document.getElementById('modelsContainer');
            if (!container) return;

            const card = document.createElement('div');
            card.className = 'model-card';
            card.id = id;

            const data = defaultData || {
                type: 'JUDOGI COMPLET',
                size: '100 cm',
                dest: 'PRÊT CLUB',
                l1: 'Dojo Dornois — Matériel de prêt',
                l2: 'Pack complet',
                l3: '',
                theme: 'theme-complet',
                font: "'Fredoka', sans-serif",
                qty: 1
            };

            card.innerHTML = `
                <div class="model-card-header">
                    <div class="model-card-title">🏷️ #${modelCount} <span class="card-summary">${escapeHTML(data.size)}</span></div>
                    <button class="btn-sm-del" onclick="removeModelCard('${id}')">✕</button>
                </div>

                <div class="preset-bar">
                    <button type="button" class="btn-preset-mini" onclick="applyCardPreset('${id}', 'COMPLET_CLUB')">🥋 Prêt Club</button>
                    <button type="button" class="btn-preset-mini" onclick="applyCardPreset('${id}', 'COMPLET_ECOLE')">🥋 École</button>
                    <button type="button" class="btn-preset-mini" onclick="applyCardPreset('${id}', 'VESTE_SEULE')">🧥 Veste</button>
                    <button type="button" class="btn-preset-mini" onclick="applyCardPreset('${id}', 'PANTALON_SEUL')">👖 Pantalon</button>
                    <button type="button" class="btn-preset-mini" onclick="applyCardPreset('${id}', 'COMPTA')">📁 Compta</button>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Type de pièce</label>
                        <select class="m-type" onchange="renderFullSheet()">
                            <option value="JUDOGI COMPLET" ${data.type === 'JUDOGI COMPLET' ? 'selected':''}>JUDOGI COMPLET</option>
                            <option value="VESTE SEULE" ${data.type === 'VESTE SEULE' ? 'selected':''}>VESTE SEULE</option>
                            <option value="PANTALON SEUL" ${data.type === 'PANTALON SEUL' ? 'selected':''}>PANTALON SEUL</option>
                            <option value="PIÈCE DÉPAREILLÉE" ${data.type === 'PIÈCE DÉPAREILLÉE' ? 'selected':''}>PIÈCE DÉPAREILLÉE</option>
                            <option value="LOT DE CEINTURES" ${data.type === 'LOT DE CEINTURES' ? 'selected':''}>LOT DE CEINTURES</option>
                            <option value="VIGNETTE CLASSEUR" ${data.type === 'VIGNETTE CLASSEUR' ? 'selected':''}>VIGNETTE CLASSEUR</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Taille / Intitulé</label>
                        <input type="text" class="m-size" value="${data.size}" oninput="renderFullSheet()">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Affectation</label>
                        <select class="m-dest" onchange="renderFullSheet()">
                            <option value="PRÊT CLUB" ${data.dest === 'PRÊT CLUB' ? 'selected':''}>PRÊT CLUB</option>
                            <option value="ÉCOLE / TER" ${data.dest === 'ÉCOLE / TER' ? 'selected':''}>ÉCOLE / TER</option>
                            <option value="STOCK GÉNÉRAL" ${data.dest === 'STOCK GÉNÉRAL' ? 'selected':''}>STOCK GÉNÉRAL</option>
                            <option value="GESTION / ADMIN" ${data.dest === 'GESTION / ADMIN' ? 'selected':''}>GESTION / ADMIN</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Thème visuel</label>
                        <select class="m-theme" onchange="renderFullSheet()">
                            <option value="theme-complet" ${data.theme === 'theme-complet' ? 'selected':''}>🔴 Rouge (Complet)</option>
                            <option value="theme-veste" ${data.theme === 'theme-veste' ? 'selected':''}>🟠 Orange (Veste)</option>
                            <option value="theme-pantalon" ${data.theme === 'theme-pantalon' ? 'selected':''}>🟢 Vert (Pantalon)</option>
                            <option value="theme-inconnu" ${data.theme === 'theme-inconnu' ? 'selected':''}>🟣 Violet (Taille ?)</option>
                            <option value="theme-ceintures" ${data.theme === 'theme-ceintures' ? 'selected':''}>🔵 Bleu Nuit</option>
                            <option value="theme-compta" ${data.theme === 'theme-compta' ? 'selected':''}>⚫ Noir / Compta</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Ligne 1</label>
                    <input type="text" class="m-l1" value="${data.l1}" oninput="renderFullSheet()">
                </div>
                <div class="form-group">
                    <label>Ligne 2</label>
                    <input type="text" class="m-l2" value="${data.l2}" oninput="renderFullSheet()">
                </div>
                <div class="form-group">
                    <label>Ligne 3</label>
                    <input type="text" class="m-l3" value="${data.l3}" oninput="renderFullSheet()">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Police Titre</label>
                        <select class="m-font" onchange="renderFullSheet()">
                            <option value="'Fredoka', sans-serif" ${data.font.includes('Fredoka') ? 'selected':''}>Fredoka</option>
                            <option value="'Roboto', sans-serif" ${data.font.includes('Roboto') ? 'selected':''}>Roboto</option>
                            <option value="'Montserrat', sans-serif" ${data.font.includes('Montserrat') ? 'selected':''}>Montserrat</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Quantité voulue</label>
                        <input type="number" class="m-qty" value="${data.qty}" min="1" max="24" oninput="renderFullSheet()">
                    </div>
                </div>
            `;
            container.appendChild(card);
            renderFullSheet();
        }

        function removeModelCard(cardId) {
            const el = document.getElementById(cardId);
            if (el) { el.remove(); renderFullSheet(); }
        }

        function applyCardPreset(cardId, presetType) {
            const card = document.getElementById(cardId);
            if (!card) return;

            const type = card.querySelector('.m-type');
            const dest = card.querySelector('.m-dest');
            const theme = card.querySelector('.m-theme');
            const size = card.querySelector('.m-size');
            const l1 = card.querySelector('.m-l1');
            const l2 = card.querySelector('.m-l2');
            const l3 = card.querySelector('.m-l3');

            if (presetType === 'COMPLET_CLUB') {
                type.value = 'JUDOGI COMPLET';
                dest.value = 'PRÊT CLUB';
                theme.value = 'theme-complet';
                size.value = '100 cm';
                l1.value = 'Dojo Dornois — Matériel de prêt';
                l2.value = 'Pack complet';
                l3.value = '';
            } else if (presetType === 'COMPLET_ECOLE') {
                type.value = 'JUDOGI COMPLET';
                dest.value = 'ÉCOLE / TER';
                theme.value = 'theme-complet';
                size.value = '100 cm';
                l1.value = 'École Primaire — Nom : __________';
                l2.value = 'Pack : Veste + Pantalon + Ceinture';
                l3.value = 'Ranger soigneusement dans la pochette';
            } else if (presetType === 'VESTE_SEULE') {
                type.value = 'VESTE SEULE';
                dest.value = 'PRÊT CLUB';
                theme.value = 'theme-veste';
                size.value = '140 cm';
                l1.value = 'Dépannage / Oubli';
                l2.value = 'Veste grain de riz sans pantalon';
                l3.value = 'Caisse Pièces Dépareillées';
            } else if (presetType === 'PANTALON_SEUL') {
                type.value = 'PANTALON SEUL';
                dest.value = 'PRÊT CLUB';
                theme.value = 'theme-pantalon';
                size.value = '120 cm';
                l1.value = 'Dépannage / Toile renforcée';
                l2.value = 'Pantalon de judo avec cordon';
                l3.value = 'Caisse Pièces Dépareillées';
            } else if (presetType === 'COMPTA') {
                type.value = 'VIGNETTE CLASSEUR';
                dest.value = 'GESTION / ADMIN';
                theme.value = 'theme-compta';
                size.value = 'EXERCICE COMPTABLE';
                l1.value = 'Saison 2026 - 2027';
                l2.value = 'Classeur Comptabilité & Factures';
                l3.value = '';
            }

            renderFullSheet();
        }

        function loadSavedPdfModels() {
            const container = document.getElementById('modelsContainer');
            if (!container) return;
            container.innerHTML = '';
            modelCount = 0;

            const pdfList = [
                { type: 'JUDOGI COMPLET', size: '100 cm', dest: 'PRÊT CLUB', l1: 'Dojo Dornois — Matériel de prêt', l2: 'Pack complet', l3: '', theme: 'theme-complet', font: "'Fredoka', sans-serif", qty: 4 },
                { type: 'JUDOGI COMPLET', size: '110 cm', dest: 'PRÊT CLUB', l1: 'Dojo Dornois — Matériel de prêt', l2: 'Pack complet', l3: '', theme: 'theme-complet', font: "'Fredoka', sans-serif", qty: 2 },
                { type: 'JUDOGI COMPLET', size: '120 cm', dest: 'PRÊT CLUB', l1: 'Dojo Dornois — Matériel de prêt', l2: 'Pack complet', l3: '', theme: 'theme-complet', font: "'Fredoka', sans-serif", qty: 1 },
                { type: 'JUDOGI COMPLET', size: '130 cm', dest: 'PRÊT CLUB', l1: 'Dojo Dornois — Matériel de prêt', l2: 'Pack complet', l3: '', theme: 'theme-complet', font: "'Fredoka', sans-serif", qty: 3 },
                { type: 'VESTE SEULE', size: '100 cm', dest: 'PRÊT CLUB', l1: 'Dépannage / Oubli', l2: 'Veste grain de riz sans pantalon', l3: 'Caisse Pièces Dépareillées', theme: 'theme-veste', font: "'Fredoka', sans-serif", qty: 1 },
                { type: 'VESTE SEULE', size: '140 cm', dest: 'PRÊT CLUB', l1: 'Dépannage / Oubli', l2: 'Veste grain de riz sans pantalon', l3: 'Caisse Pièces Dépareillées', theme: 'theme-veste', font: "'Fredoka', sans-serif", qty: 3 },
                { type: 'VESTE SEULE', size: '160 cm', dest: 'PRÊT CLUB', l1: 'Dépannage / Oubli', l2: 'Veste grain de riz sans pantalon', l3: 'Caisse Pièces Dépareillées', theme: 'theme-veste', font: "'Fredoka', sans-serif", qty: 1 },
                { type: 'VESTE SEULE', size: '180 cm', dest: 'PRÊT CLUB', l1: 'Dépannage / Oubli', l2: 'Veste grain de riz sans pantalon', l3: 'Caisse Pièces Dépareillées', theme: 'theme-veste', font: "'Fredoka', sans-serif", qty: 1 },
                { type: 'PANTALON SEUL', size: '120 cm', dest: 'PRÊT CLUB', l1: 'Dépannage / Toile renforcée', l2: 'Pantalon de judo avec cordon', l3: 'Caisse Pièces Dépareillées', theme: 'theme-pantalon', font: "'Fredoka', sans-serif", qty: 1 },
                { type: 'PANTALON SEUL', size: '170 cm', dest: 'PRÊT CLUB', l1: 'Dépannage / Toile renforcée', l2: 'Pantalon de judo avec cordon', l3: 'Caisse Pièces Dépareillées', theme: 'theme-pantalon', font: "'Fredoka', sans-serif", qty: 1 },
                { type: 'VIGNETTE CLASSEUR', size: 'EXERCICE COMPTABLE', dest: 'GESTION / ADMIN', l1: 'Saison 2026 - 2027', l2: 'Classeur Comptabilité & Factures', l3: '', theme: 'theme-compta', font: "'Fredoka', sans-serif", qty: 1 }
            ];

            pdfList.forEach(item => addNewModelCard(item));
        }

        function renderFullSheet() {
            const container = document.getElementById('labelSheetContainer');
            const skipElem = document.getElementById('lblSkip');
            if (!container || !skipElem) return;

            const skipCount = parseInt(skipElem.value) || 0;
            container.innerHTML = '';

            for (let i = 0; i < skipCount; i++) {
                const emptyCard = document.createElement('div');
                emptyCard.className = 'judo-label-card empty-slot';
                container.appendChild(emptyCard);
            }

            const modelCards = document.querySelectorAll('.model-card');
            modelCards.forEach(card => {
                const type = card.querySelector('.m-type').value;
                const size = card.querySelector('.m-size').value;
                const dest = card.querySelector('.m-dest').value;
                const l1 = card.querySelector('.m-l1').value;
                const l2 = card.querySelector('.m-l2').value;
                const l3 = card.querySelector('.m-l3').value;
                const theme = card.querySelector('.m-theme').value;
                const font = card.querySelector('.m-font').value;
                const qty = parseInt(card.querySelector('.m-qty').value) || 1;

                const summary = card.querySelector('.card-summary');
                if (summary) summary.innerText = size;

                for (let q = 0; q < qty; q++) {
                    const labelElem = document.createElement('div');
                    labelElem.className = 'judo-label-card ' + theme;

                    if (type === 'VIGNETTE CLASSEUR') {
                        labelElem.innerHTML = `
                            <div class="label-header">
                                <div class="label-header-left">
                                    <span>📁</span>
                                    <span>DOJO DORNOIS</span>
                                </div>
                                <span class="label-header-badge">${escapeHTML(dest)}</span>
                            </div>
                            <div class="label-body" style="text-align:center; justify-content:center; gap:2px;">
                                <div class="label-size-title" style="font-family:${font}; font-size:0.75rem; color:#C41E3A;">${escapeHTML(size)}</div>
                                <div style="font-family:'Fredoka',sans-serif; font-size:0.62rem; font-weight:700;">${escapeHTML(l1)}</div>
                                <div style="font-size:0.50rem; color:#64748B;">${escapeHTML(l2)}</div>
                                <div class="label-footer-line" style="margin-top:2px;">
                                    <span>dojodornois.fr</span>
                                    <span>2026-2027</span>
                                </div>
                            </div>
                        `;
                    } else {
                        labelElem.innerHTML = `
                            <div class="label-header">
                                <div class="label-header-left">
                                    <span>🥋</span>
                                    <span>DOJO DORNOIS</span>
                                </div>
                                <span class="label-header-badge">${escapeHTML(dest)}</span>
                            </div>
                            <div class="label-body">
                                <div class="label-main-info">
                                    <div class="label-size-title" style="font-family:${font}">${escapeHTML(size)}</div>
                                    <span class="label-type-pill">${escapeHTML(type)}</span>
                                </div>
                                <div class="label-details">
                                    <div><b>${escapeHTML(l1)}</b></div>
                                    <div style="color:#64748B;">${escapeHTML(l2)}</div>
                                    ${l3 ? `<div style="color:#94A3B8; font-style:italic;">${escapeHTML(l3)}</div>` : ''}
                                </div>
                                <div class="label-footer-line">
                                    <span>dojodornois.fr</span>
                                    <span>2026-2027</span>
                                </div>
                            </div>
                        `;
                    }
                    container.appendChild(labelElem);
                }
            });
        }

        function escapeHTML(str) {
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        document.addEventListener('DOMContentLoaded', () => {
            applyCalibration();
            loadSavedPdfModels();
        });
    </script>

    <!-- SCRIPT DE CHARGEMENT DE LA SIDEBAR OFFICIELLE -->
    <script src="../js/sidebar.js"></script>
</body>
