<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Intranet Dojo Dornois</title>
    <link rel="icon" type="image/png" href="https://dojodornois.fr/public/10057/upload/files/base-de-donnees/logo-dojo-dornois-transparent-contour-blanc_2.png">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --rouge: #C41E3A;
            --rouge-hover: #A3182E;
            --noir-doux: #1A1A1A;
            --fond: #F4F6F9;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--fond);
            background-image: url("data:image/svg+xml,%3Csvg width='56' height='100' viewBox='0 0 56 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M28 66L0 50L0 16L28 0L56 16L56 50L28 66ZM28 100L0 84L0 68L28 84L56 68L56 84L28 100Z' fill='none' stroke='%23C41E3A' stroke-opacity='0.15' stroke-width='1.8'/%3E%3C/svg%3E");
            margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px; border: 1px solid rgba(255,255,255,0.6);
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            padding: 32px; width: 100%; max-width: 380px; text-align: center;
        }
        .logo-box {
            background: var(--rouge); width: 64px; height: 64px; border-radius: 12px;
            margin: 0 auto 16px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 12px rgba(196, 30, 58, 0.3);
        }
        .logo-box img { width: 44px; height: 44px; object-fit: contain; }
        h1 { font-family: 'Fredoka', sans-serif; color: var(--noir-doux); font-size: 1.4rem; margin: 0 0 6px; }
        p { color: #6B6B6B; font-size: 0.85rem; margin: 0 0 24px; }
        .form-group { text-align: left; margin-bottom: 16px; }
        label { font-size: 0.8rem; font-weight: 500; color: #3D3D3D; display: block; margin-bottom: 6px; }
        input {
            width: 100%; padding: 10px 12px; border: 1px solid #E8E8E8; border-radius: 8px;
            font-size: 0.9rem; box-sizing: border-box; transition: all 0.2s;
        }
        input:focus { outline: none; border-color: var(--rouge); box-shadow: 0 0 0 3px rgba(196,30,58,0.1); }
        .btn-login {
            width: 100%; background: var(--rouge); color: white; border: none; padding: 12px;
            border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer;
            transition: background 0.2s; margin-top: 8px;
        }
        .btn-login:hover { background: var(--rouge-hover); }
        .error-msg { color: #E74C3C; font-size: 0.8rem; margin-top: 12px; display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-box">
            <img src="https://dojodornois.fr/public/10057/upload/files/base-de-donnees/logo-dojo-dornois-transparent-contour-blanc_2.png" alt="Logo">
        </div>
        <h1>Espace Sécurisé</h1>
        <p>Intranet Officiel du Dojo Dornois</p>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Adresse e-mail</label>
                <input type="email" id="email" required placeholder="nom@dojodornois.fr">
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-login" id="btnLogin">Se connecter</button>
            <div class="error-msg" id="errorMsg">Identifiants incorrects.</div>
        </form>
    </div>

    <script>
        const sbClient = supabase.createClient('https://tumrbyxfnkqobyfzucax.supabase.co', 'sb_publishable_mmpD1yytpJEEJ7FV3oTwzA_Sa55Jf_8');

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            const errorEl = document.getElementById('errorMsg');
            btn.innerText = "Vérification...";
            errorEl.style.display = 'none';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await sbClient.auth.signInWithPassword({ email, password });

            if (error) {
                errorEl.innerText = "Échec de connexion : " + error.message;
                errorEl.style.display = 'block';
                btn.innerText = "Se connecter";
            } else {
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
